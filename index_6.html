// ===================== HELPERS =====================
const generateId = () => Date.now() + Math.random().toString(36).slice(2);
const today = () => new Date().toISOString().split("T")[0];
const formatDate = (d) => d ? new Date(d).toLocaleDateString("vi-VN") : "-";
const formatCurrency = (n) => (Number(n)||0).toLocaleString("vi-VN") + " đ";
const daysUntil = (dateStr) => {
  if (!dateStr) return null;
  const diff = Math.ceil((new Date(dateStr) - new Date()) / 86400000);
  return diff;
};
const alertLevel = (days) => {
  if (days === null) return "";
  if (days < 0) return "expired";
  if (days <= 15) return "danger";
  if (days <= 30) return "warning";
  return "ok";
};

function SettingsPage({ data, update, showToast }) {
  const s = data.settings || {};
  const [tab, setTab] = React.useState("garage");
  const [form, setForm] = React.useState({
    garageName: s.garageName || "CTY TNHH TMDV SICO AUTO",
    garageAddress: s.garageAddress || "",
    garagePhone: s.garagePhone || "0905862851",
    garageEmail: s.garageEmail || "",
    garageBankAccount: s.garageBankAccount || "",
    garageReceiver: s.garageReceiver || "NGUYỄN VĂN SINH",
    appTitle: s.appTitle || "SICO AUTO",
    appSubtitle: s.appSubtitle || "Hệ thống quản lý Garage",
    defaultLaborRate: s.defaultLaborRate || 150000,
    defaultVatType: s.defaultVatType || "no_vat",
    alertDaysReg: s.alertDaysReg || 30,
    alertDaysIns: s.alertDaysIns || 30,
    alertKm: s.alertKm || 1000,
    minStock: s.minStock || 5,
    warranty: s.warranty || "",
    repairFooterNote: s.repairFooterNote || "",
  });

  const save = () => { update("settings", form); showToast("✅ Đã lưu cài đặt!"); };
  const inp = (key, ph) => <input value={form[key]||""} onChange={e => setForm({...form, [key]: e.target.value})} placeholder={ph||""} style={{ width:"100%", padding:"8px 10px", border:"1px solid #ddd", borderRadius:6, fontSize:13, boxSizing:"border-box" }} />;
  const num = (key, min) => <input type="number" value={form[key]||0} min={min||0} onChange={e => setForm({...form, [key]: Number(e.target.value)})} style={{ width:"100%", padding:"8px 10px", border:"1px solid #ddd", borderRadius:6, fontSize:13 }} />;
  const lbl = (t, s) => <div style={{ marginBottom:4 }}><label style={{ fontSize:12, fontWeight:600, color:"#555" }}>{t}</label>{s && <div style={{ fontSize:11, color:"#aaa" }}>{s}</div>}</div>;
  const sec = (t) => <div style={{ fontWeight:700, color:"#1a237e", padding:"5px 10px", background:"#e8eaf6", borderLeft:"4px solid #1a237e", borderRadius:4, marginBottom:14 }}>{t}</div>;

  const TABS = [
    { id:"garage", label:"🏢 Thông tin Garage" },
    { id:"quotes", label:"🧾 Báo giá" },
    { id:"repair", label:"🔧 Lệnh sửa chữa" },
    { id:"alerts", label:"🔔 Cảnh báo" },
    { id:"display", label:"🎨 Hiển thị" },
    { id:"warranty", label:"📋 Điều khoản BH" },
  ];

  return (
    <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
      <Card>
        <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>

function SicoAuto() {

              a.href = url; a.download = "sico-backup-" + new Date().toISOString().slice(0,10) + ".json";
              a.click(); URL.revokeObjectURL(url);
            }} style={{ flex:1, padding:"8px 4px", background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:6, color:"#fff", fontSize:11, fontWeight:600, cursor:"pointer" }}>

              <input type="file" accept=".json" style={{ display:"none" }} onChange={e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                  try {
                    const imported = JSON.parse(ev.target.result);
                    if (!Object.keys(imported).length) { alert("File trống!"); return; }
                    if (window.confirm("Nhập data sẽ GHI ĐÈ toàn bộ dữ liệu. Tiếp tục?")) {
                      Object.keys(imported).forEach(key => update(key, imported[key]));
                      alert("Nhập data thành công!");
                    }
                  } catch(err) { alert("File không hợp lệ!"); }
                };
                reader.readAsText(file); e.target.value = "";
              }} />
            </label>
          </div>
          <div style={{ fontSize: 11, color: "#90caf9", textAlign: "center" }}>© 2026 SICO AUTO v1.0</div>
        </div>

function VehiclesPage({ data, update, showToast }) {
  const [search, setSearch] = useState("");

  const [filter, setFilter] = useState("all");

  const filtered = data.vehicles.filter(v => {
    const q = search.toLowerCase();
    const match = v.licensePlate.toLowerCase().includes(q) || v.vehicleName.toLowerCase().includes(q) ||
      v.frameNumber.toLowerCase().includes(q) || (data.customers.find(c => c.id === v.customerId)?.name || "").toLowerCase().includes(q);
    if (!match) return false;
    if (filter === "reg") return alertLevel(daysUntil(v.registrationExpiry)) !== "ok";
    if (filter === "ins") return alertLevel(daysUntil(v.insuranceExpiry)) !== "ok";
    return true;
  });

  const openNew = () => { setForm({ ...EMPTY_VEHICLE, id: generateId() }); setModal("form"); };

    if (!form.licensePlate || !form.customerId) return showToast("Vui lòng nhập biển số và chọn khách hàng", "error");
    const exists = data.vehicles.find(v => v.id === form.id);
    const updated = exists ? data.vehicles.map(v => v.id === form.id ? form : v) : [...data.vehicles, form];
    update("vehicles", updated);
    showToast(exists ? "Đã cập nhật thông tin xe" : "Đã tiếp nhận xe mới");

// ===================== REPAIR ORDER PAGE =====================
function RepairPage({ data, update, showToast }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_REPAIR_ORDER);
  const [orderParts, setOrderParts] = useState([]);

  const filtered = data.repairOrders.filter(r => {
    const v = data.vehicles.find(v => v.id === r.vehicleId);
    const c = data.customers.find(c => c.id === r.customerId);
    const q = search.toLowerCase();
    const match = (v?.licensePlate || "").toLowerCase().includes(q) || (c?.name || "").toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    if (statusFilter !== "all" && r.status !== statusFilter) return false;
    return match;
  });

  const openNew = () => {
    setForm({ ...EMPTY_REPAIR_ORDER, id: generateId(), receiveDate: today() });
    setOrderParts([]);
    setModal("form");
  };
  const openEdit = (r) => {
    setForm({ ...r });
    setOrderParts(r.parts || []);
    setModal("form");
  };
  const openView = (r) => { setForm({ ...r }); setOrderParts(r.parts || []); setModal("view"); };

  const calcTotal = (f, pts) => {
    const totalParts = pts.reduce((s, p) => s + (p.qty * p.price), 0);
    const totalAmount = (Number(f.totalLabor) || 0) + totalParts - (Number(f.discount) || 0);
    return { totalParts, totalAmount };
  };

  const addPart = () => setOrderParts([...orderParts, { partId: "", name: "", qty: 1, unit: "", price: 0 }]);
  const removePart = (i) => setOrderParts(orderParts.filter((_, idx) => idx !== i));
  const updatePart = (i, field, val) => {
    const pts = [...orderParts];
    pts[i] = { ...pts[i], [field]: val };
    if (field === "partId") {
      const p = data.parts.find(p => p.id === val);
      if (p) { pts[i].name = p.name; pts[i].unit = p.unit; pts[i].price = p.salePrice; }
    }
    setOrderParts(pts);
  };

  const save = () => {
    if (!form.vehicleId || !form.customerId) return showToast("Chọn xe và khách hàng", "error");
    const { totalParts, totalAmount } = calcTotal(form, orderParts);
    const saved = { ...form, parts: orderParts, totalParts, totalAmount };
    const exists = data.repairOrders.find(r => r.id === form.id);
    const updated = exists ? data.repairOrders.map(r => r.id === form.id ? saved : r) : [...data.repairOrders, saved];
    // If status changed to Hoàn thành, deduct stock
    if (form.status === "Hoàn thành" && orderParts.length > 0) {
      const newParts = data.parts.map(p => {
        const used = orderParts.find(op => op.partId === p.id);
        if (used) return { ...p, stock: Math.max(0, p.stock - Number(used.qty)) };
        return p;
      });
      update("parts", newParts);
      // Log movement
      const movements = [...data.stockMovements, ...orderParts.filter(op => op.partId).map(op => ({
        id: generateId(), date: today(), type: "Xuất", partId: op.partId,
        partName: op.name, qty: op.qty, ref: `LSC-${form.id.slice(-4).toUpperCase()}`, note: "Xuất theo LSC"
      }))];
      update("stockMovements", movements);
    }
    update("repairOrders", updated);
    showToast(exists ? "Đã cập nhật lệnh sửa chữa" : "Đã tạo lệnh sửa chữa");
    setModal(null);
  };

  const { totalParts, totalAmount } = calcTotal(form, orderParts);

  const statusOptions = ["Tiếp nhận", "Đang sửa", "Chờ phụ tùng", "Hoàn thành", "Đã xuất xưởng", "Huỷ"];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm biển số, khách hàng..."
              style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 240 }} />
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13 }}>
              <option value="all">Tất cả trạng thái</option>
              {statusOptions.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Btn onClick={openNew}>➕ Tạo lệnh sửa chữa</Btn>
        </div>
      </Card>
      <Card>
        <Table
          headers={["Mã LSC", "Ngày", "Biển số", "Khách hàng", "Triệu chứng", "KTV", "Tổng tiền", "Trạng thái", "Thao tác"]}
          rows={filtered.map(r => {
            const v = data.vehicles.find(v => v.id === r.vehicleId);
            const c = data.customers.find(c => c.id === r.customerId);
            const t = data.technicians.find(t => t.id === r.technicianId);
            return [
              <span style={{ fontWeight: 800, color: "#1a237e" }}>#{r.id.slice(-4).toUpperCase()}</span>,
              formatDate(r.receiveDate),
              <span style={{ fontWeight: 700 }}>{v?.licensePlate || "-"}</span>,
              c?.name || "-",
              r.symptoms.slice(0, 35) + (r.symptoms.length > 35 ? "..." : ""),
              t?.name || "-",
              <span style={{ fontWeight: 700, color: "#2e7d32" }}>{formatCurrency(r.totalAmount)}</span>,
              <StatusBadge status={r.status} />,
              <div style={{ display: "flex", gap: 4 }}>
                <Btn size="sm" onClick={() => openView(r)} outline color="#1565c0">👁️</Btn>
                <Btn size="sm" onClick={() => openEdit(r)} outline>✏️</Btn>
                <Btn size="sm" onClick={() => {

function QuotesPage({ data, update, showToast }) {
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({ id: null, vehicleId: "", customerId: "", date: today(), items: [], notes: "", status: "Chờ duyệt", discount: 0 });

  const addItem = () => setForm(f => ({ ...f, items: [...f.items, { name: "", qty: 1, unit: "Cái", price: 0 }] }));
  const removeItem = (i) => setForm(f => ({ ...f, items: f.items.filter((_, idx) => idx !== i) }));
  const updateItem = (i, field, val) => setForm(f => { const items = [...f.items]; items[i] = { ...items[i], [field]: val }; return { ...f, items }; });
  const total = form.items.reduce((s, it) => s + (it.qty * it.price), 0) - Number(form.discount || 0);

  const save = () => {
    if (!form.customerId) return showToast("Chọn khách hàng", "error");
    const id = form.id || generateId();
    const saved = { ...form, id, total };
    const exists = (data.quotes || []).find(q => q.id === form.id);
    const updated = exists ? (data.quotes || []).map(q => q.id === form.id ? saved : q) : [...(data.quotes || []), saved];
    update("quotes", updated);
    showToast("Đã lưu báo giá");
    setModal(null);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

// ===================== PARTS PAGE =====================
function PartsPage({ data, update, showToast }) {
  const [tab, setTab] = useState("inventory");
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_PART);
  const [moveForm, setMoveForm] = useState({ partId: "", type: "Nhập", qty: 1, note: "", date: today() });

  const filtered = data.parts.filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) ||
    p.code.toLowerCase().includes(search.toLowerCase())
  );

  const openNew = () => { setForm({ ...EMPTY_PART, id: generateId() }); setModal("part"); };
  const openEdit = (p) => { setForm({ ...p }); setModal("part"); };
  const savePart = () => {
    if (!form.name || !form.code) return showToast("Nhập mã và tên vật tư", "error");
    const exists = data.parts.find(p => p.id === form.id);
    const updated = exists ? data.parts.map(p => p.id === form.id ? form : p) : [...data.parts, form];
    update("parts", updated);
    showToast(exists ? "Đã cập nhật" : "Đã thêm vật tư");
    setModal(null);
  };
  const del = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa vật tư?")) return;
    update("parts", data.parts.filter(p => p.id !== id));
    showToast("Đã xóa");
  };
  const saveMove = () => {
    if (!moveForm.partId || !moveForm.qty) return showToast("Chọn vật tư và số lượng", "error");
    const part = data.parts.find(p => p.id === moveForm.partId);
    if (!part) return;
    const newQty = moveForm.type === "Nhập" ? part.stock + Number(moveForm.qty) : Math.max(0, part.stock - Number(moveForm.qty));
    const newParts = data.parts.map(p => p.id === moveForm.partId ? { ...p, stock: newQty } : p);
    const movement = { id: generateId(), date: moveForm.date, type: moveForm.type, partId: moveForm.partId, partName: part.name, qty: Number(moveForm.qty), note: moveForm.note, ref: moveForm.type + "-" + today() };
    update("parts", newParts);
    update("stockMovements", [...data.stockMovements, movement]);
    showToast(`Đã ${moveForm.type} kho thành công`);
    setMoveForm({ partId: "", type: "Nhập", qty: 1, note: "", date: today() });
    setModal(null);
  };

  const tabs = [
    { id: "inventory", label: "📦 Tồn kho" },
    { id: "movements", label: "📋 Xuất nhập kho" },
    { id: "lowstock", label: `⚠️ Sắp hết (${data.parts.filter(p => p.stock <= p.minStock).length})` }
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 0, background: "#fff", borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.08)" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            style={{ flex: 1, padding: "12px", border: "none", background: tab === t.id ? "#1a237e" : "transparent", color: tab === t.id ? "#fff" : "#666", fontWeight: tab === t.id ? 700 : 400, cursor: "pointer", fontSize: 13, transition: "all .15s" }}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "inventory" && (
        <>
          <Card>
            <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center" }}>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm mã, tên vật tư..."
                style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 260 }} />
              <div style={{ display: "flex", gap: 8 }}>
                <Btn outline onClick={() => setModal("move")}>📤 Xuất / Nhập kho</Btn>
                <Btn onClick={openNew}>➕ Thêm vật tư</Btn>
              </div>
            </div>
          </Card>
          <Card>
            <Table
              headers={["Mã", "Tên vật tư", "Nhóm", "ĐV", "Giá vốn", "Giá bán", "Tồn kho", "Vị trí", "Thao tác"]}
              rows={filtered.map(p => [
                <span style={{ fontFamily: "monospace", fontWeight: 700, color: "#1a237e" }}>{p.code}</span>,
                p.name, p.category, p.unit,
                formatCurrency(p.costPrice), formatCurrency(p.salePrice),
                <span style={{ fontWeight: 700, color: p.stock <= p.minStock ? "#c62828" : "#2e7d32" }}>{p.stock} {p.unit} {p.stock <= p.minStock ? "⚠️" : ""}</span>,
                p.location || "-",
                <div style={{ display: "flex", gap: 4 }}>
                  <Btn size="sm" onClick={() => openEdit(p)} outline>✏️</Btn>
                  <Btn size="sm" onClick={() => del(p.id)} color="#c62828" outline>🗑️</Btn>
                </div>
              ])}
            />
          </Card>
        </>
      )}

      {tab === "movements" && (
        <Card>
          <Table
            headers={["Ngày", "Loại", "Vật tư", "Số lượng", "Chứng từ", "Ghi chú"]}
            rows={(data.stockMovements || []).slice().reverse().map(m => [
              formatDate(m.date),
              <Badge label={m.type} color={m.type === "Nhập" ? "#2e7d32" : "#f57c00"} />,
              m.partName, m.qty, m.ref || "-", m.note || "-"
            ])}
            emptyMsg="Chưa có giao dịch kho"
          />
        </Card>
      )}

      {tab === "lowstock" && (
        <Card>
          <div style={{ marginBottom: 12, color: "#c62828", fontWeight: 700 }}>⚠️ Các vật tư có tồn kho dưới mức tối thiểu</div>
          <Table
            headers={["Mã", "Tên vật tư", "Tồn hiện tại", "Tồn tối thiểu", "Cần nhập thêm"]}
            rows={data.parts.filter(p => p.stock <= p.minStock).map(p => [
              p.code, p.name,
              <span style={{ color: "#c62828", fontWeight: 700 }}>{p.stock} {p.unit}</span>,
              `${p.minStock} ${p.unit}`,
              <span style={{ color: "#f57c00", fontWeight: 700 }}>{Math.max(0, p.minStock * 2 - p.stock)} {p.unit}</span>
            ])}
            emptyMsg="Kho đủ hàng ✅"
          />
        </Card>
      )}

      {modal === "part" && (
        <Modal title={data.parts.find(p => p.id === form.id) ? "Cập nhật vật tư" : "Thêm vật tư"} onClose={() => setModal(null)}>
          <Grid cols={2} gap={12}>
            <Input label="Mã vật tư" value={form.code} onChange={v => setForm({ ...form, code: v })} required />
            <Input label="Tên vật tư" value={form.name} onChange={v => setForm({ ...form, name: v })} required />
            <Input label="Nhóm / Danh mục" value={form.category} onChange={v => setForm({ ...form, category: v })} />
            <Input label="Đơn vị tính" value={form.unit} onChange={v => setForm({ ...form, unit: v })} />
            <Input label="Giá vốn (đ)" value={form.costPrice} onChange={v => setForm({ ...form, costPrice: v })} type="number" />
            <Input label="Giá bán (đ)" value={form.salePrice} onChange={v => setForm({ ...form, salePrice: v })} type="number" />
            <Input label="Tồn kho hiện tại" value={form.stock} onChange={v => setForm({ ...form, stock: v })} type="number" />
            <Input label="Tồn kho tối thiểu" value={form.minStock} onChange={v => setForm({ ...form, minStock: v })} type="number" />
            <Input label="Vị trí lưu kho" value={form.location} onChange={v => setForm({ ...form, location: v })} style={{ gridColumn: "span 2" }} />
          </Grid>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={savePart}>💾 Lưu</Btn>
          </div>
        </Modal>
      )}

      {modal === "move" && (
        <Modal title="Xuất / Nhập kho" onClose={() => setModal(null)} width={480}>
          <Grid cols={2} gap={12}>
            <Input label="Loại giao dịch" value={moveForm.type} onChange={v => setMoveForm({ ...moveForm, type: v })} options={["Nhập", "Xuất"]} />
            <Input label="Ngày" value={moveForm.date} onChange={v => setMoveForm({ ...moveForm, date: v })} type="date" />
            <div style={{ gridColumn: "span 2" }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>Vật tư</label>
              <select value={moveForm.partId} onChange={e => setMoveForm({ ...moveForm, partId: e.target.value })}
                style={{ width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, marginTop: 4 }}>
                <option value="">-- Chọn vật tư --</option>
                {data.parts.map(p => <option key={p.id} value={p.id}>{p.name} (Tồn: {p.stock} {p.unit})</option>)}
              </select>
            </div>
            <Input label="Số lượng" value={moveForm.qty} onChange={v => setMoveForm({ ...moveForm, qty: v })} type="number" />
            <Input label="Ghi chú" value={moveForm.note} onChange={v => setMoveForm({ ...moveForm, note: v })} />
          </Grid>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={saveMove}>{moveForm.type === "Nhập" ? "📥 Nhập kho" : "📤 Xuất kho"}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function AccountingPage({ data }) {
  const [period, setPeriod] = useState("month");
  const now = new Date();
  const filterByPeriod = (r) => {
    const d = new Date(r.receiveDate || r.date);
    if (period === "today") return (r.receiveDate || r.date) === today();
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  };

  const orders = data.repairOrders.filter(filterByPeriod);
  const completed = orders.filter(r => r.status === "Hoàn thành" || r.status === "Đã xuất xưởng");
  const revenue = completed.reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
  const labor = completed.reduce((s, r) => s + (Number(r.totalLabor) || 0), 0);
  const partsRev = completed.reduce((s, r) => s + (Number(r.totalParts) || 0), 0);
  const partsCost = completed.reduce((s, r) => {
    const pts = r.parts || [];
    return s + pts.reduce((ps, pt) => {
      const p = data.parts.find(p => p.id === pt.partId);
      return ps + (p ? p.costPrice * pt.qty : 0);
    }, 0);
  }, 0);
  const discount = completed.reduce((s, r) => s + (Number(r.discount) || 0), 0);
  const paid = completed.reduce((s, r) => s + (Number(r.paid) || 0), 0);
  const debt = completed.reduce((s, r) => s + (Number(r.totalAmount) - Number(r.paid)), 0);
  const stockValue = data.parts.reduce((s, p) => s + p.costPrice * p.stock, 0);

  // Operating costs from salary records + operating expenses
  const salaryRecordsInPeriod = (data.salaryRecords || []).filter(sr => {
    if (period === "all") return true;
    const d = new Date(sr.month + "-01");
    if (period === "today") return false;
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  });
  const totalSalaryPaid = salaryRecordsInPeriod.reduce((s, sr) => s + (Number(sr.netSalary) || 0), 0);
  const totalBHXHCompany = salaryRecordsInPeriod.reduce((s, sr) => s + (Number(sr.bhxhCompany) || 0) + (Number(sr.bhytCompany) || 0) + (Number(sr.bhtnCompany) || 0), 0);
  const opExpenses = (data.operatingExpenses || []).filter(filterByPeriod);
  const totalOpExp = opExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalCosts = partsCost + totalSalaryPaid + totalBHXHCompany + totalOpExp;
  const netProfit = revenue - totalCosts;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ fontWeight: 700, color: "#1a237e" }}>Kỳ báo cáo:</div>
          {[["today", "Hôm nay"], ["month", "Tháng này"], ["year", "Năm nay"], ["all", "Tất cả"]].map(([v, l]) => (
            <button key={v} onClick={() => setPeriod(v)}
              style={{ padding: "6px 16px", border: `2px solid ${period === v ? "#1a237e" : "#ddd"}`, borderRadius: 20, background: period === v ? "#1a237e" : "#fff", color: period === v ? "#fff" : "#666", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
              {l}
            </button>
          ))}
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        <StatCard label="Tổng doanh thu" value={formatCurrency(revenue)} icon="💰" color="#2e7d32" sub={`${completed.length} lệnh hoàn thành`} />
        <StatCard label="Lợi nhuận ròng" value={formatCurrency(netProfit)} icon="📈" color={netProfit >= 0 ? "#1a237e" : "#c62828"} sub="Sau tất cả chi phí" />
        <StatCard label="Đã thu" value={formatCurrency(paid)} icon="✅" color="#1565c0" />
        <StatCard label="Công nợ còn lại" value={formatCurrency(Math.max(0, debt))} icon="⚠️" color={debt > 0 ? "#c62828" : "#2e7d32"} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <Card>
          <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12, fontSize: 15 }}>📊 Báo cáo lãi lỗ (P&L)</div>
          {[
            { label: "Doanh thu sửa chữa", val: revenue, color: "#2e7d32", indent: 0 },
            { label: "  — Tiền công lao động", val: labor, color: "#1565c0", indent: 1 },
            { label: "  — Doanh thu vật tư", val: partsRev, color: "#1565c0", indent: 1 },
            { label: "  — Chiết khấu", val: -discount, color: "#f57c00", indent: 1 },
            { label: "Giá vốn vật tư", val: -partsCost, color: "#c62828", indent: 0 },
            { label: "Chi phí lương nhân viên", val: -totalSalaryPaid, color: "#c62828", indent: 0 },
            { label: "BHXH công ty đóng", val: -totalBHXHCompany, color: "#c62828", indent: 0 },
            { label: "Chi phí vận hành khác", val: -totalOpExp, color: "#c62828", indent: 0 },
            { label: "LỢI NHUẬN RÒNG", val: netProfit, color: netProfit >= 0 ? "#1a237e" : "#c62828", indent: 0, bold: true },
          ].map((item, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: i < 8 ? "1px solid #f5f5f5" : "2px solid #1a237e", paddingLeft: item.indent ? 16 : 0 }}>

              <span style={{ fontWeight: item.bold ? 800 : 700, color: item.color, fontSize: item.bold ? 16 : 14 }}>{formatCurrency(item.val)}</span>
            </div>
          ))}
        </Card>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Card>
            <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12, fontSize: 15 }}>👥 Chi phí nhân sự trong kỳ</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { label: "Lương net đã chi", val: totalSalaryPaid, color: "#c62828", bg: "#ffebee" },
                { label: "BHXH/BHYT/BHTN (công ty)", val: totalBHXHCompany, color: "#c62828", bg: "#ffebee" },
                { label: "Tổng chi nhân sự", val: totalSalaryPaid + totalBHXHCompany, color: "#7b1fa2", bg: "#f3e5f5", bold: true },
              ].map((item, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", background: item.bg, borderRadius: 8 }}>
                  <span style={{ fontSize: 13, fontWeight: item.bold ? 700 : 500 }}>{item.label}</span>
                  <span style={{ fontWeight: 800, color: item.color }}>{formatCurrency(item.val)}</span>
                </div>
              ))}
            </div>
          </Card>
          <Card>
            <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12, fontSize: 15 }}>🏭 Kho hàng & Chi phí khác</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {[
                { label: "Giá trị tồn kho", val: stockValue, color: "#2e7d32", bg: "#e8f5e9" },
                { label: "Chi phí vận hành khác", val: totalOpExp, color: "#f57c00", bg: "#fff3e0" },

              ].map((item, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "9px 12px", background: item.bg, borderRadius: 8 }}>
                  <span style={{ fontSize: 13 }}>{item.label}</span>

      <Card>

          rows={orders.slice(0, 20).map(r => {

    </div>
  );

// BHXH rates Vietnam 2026: Employee: BHXH 8%, BHYT 1.5%, BHTN 1% = 10.5%
//                          Company:  BHXH 17.5%, BHYT 3%, BHTN 1% = 21.5%
const BHXH_EMP = { bhxh: 8, bhyt: 1.5, bhtn: 1 };
const BHXH_CO  = { bhxh: 17.5, bhyt: 3, bhtn: 1 };
const calcSalary = (staff, bonus = 0, deduct = 0, workDays = 26) => {
  const base = Number(staff.basicSalary) || 0;
  const allowance = Number(staff.allowance) || 0;
  const grossBase = base * (workDays / 26); // pro-rate by days
  const bhxhEmp = grossBase * (BHXH_EMP.bhxh + BHXH_EMP.bhyt + BHXH_EMP.bhtn) / 100;
  const bhxhCo  = grossBase * (BHXH_CO.bhxh + BHXH_CO.bhyt + BHXH_CO.bhtn) / 100;
  const bhytCo  = 0; // already in bhxhCo combined
  const bhtnCo  = 0;
  const gross = grossBase + allowance + Number(bonus);
  const net = gross - bhxhEmp - Number(deduct);
  const bhxhCoAmt = grossBase * BHXH_CO.bhxh / 100;
  const bhytCoAmt = grossBase * BHXH_CO.bhyt / 100;
  const bhtnCoAmt = grossBase * BHXH_CO.bhtn / 100;
  const bhxhEmpAmt = grossBase * BHXH_EMP.bhxh / 100;
  const bhytEmpAmt = grossBase * BHXH_EMP.bhyt / 100;
  const bhtnEmpAmt = grossBase * BHXH_EMP.bhtn / 100;
  return { grossBase, allowance, bonus: Number(bonus), deduct: Number(deduct), gross, bhxhEmpAmt, bhytEmpAmt, bhtnEmpAmt, bhxhEmp, net, bhxhCoAmt, bhytCoAmt, bhtnCoAmt, bhxhCo: bhxhCoAmt + bhytCoAmt + bhtnCoAmt };
};

const EMPTY_STAFF = { id: null, name: "", phone: "", idCard: "", position: "", department: "Kỹ thuật", startDate: "", basicSalary: 0, allowance: 0, status: "active" };
const EXPENSE_CATS = ["Mặt bằng", "Điện nước", "Internet/Điện thoại", "Văn phòng phẩm", "Công cụ dụng cụ", "Marketing/Quảng cáo", "Bảo trì thiết bị", "Vận chuyển", "Thuế phí", "Chi phí khác"];

function ExpensesPage({ data, update, showToast }) {
  const [tab, setTab] = useState("staff");
  const [modal, setModal] = useState(null);
  const [staffForm, setStaffForm] = useState(EMPTY_STAFF);
  const [salaryMonth, setSalaryMonth] = useState(() => {
    const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  });
  const [salaryData, setSalaryData] = useState({});
  const [expForm, setExpForm] = useState({ id: null, date: today(), category: "", description: "", amount: 0, paymentMethod: "Tiền mặt", notes: "" });
  const [expSearch, setExpSearch] = useState("");

  // Init salary overrides for current month
  const initSalaryOverrides = (month) => {
    const existing = {};
    (data.salaryRecords || []).filter(s => s.month === month).forEach(s => { existing[s.staffId] = s; });
    return existing;
  };

  const handleOpenSalary = () => {
    setSalaryData(initSalaryOverrides(salaryMonth));
    setModal("salary");
  };

  const getSalaryRow = (staff) => {
    const override = salaryData[staff.id] || {};
    const bonus = override.bonus || 0;
    const deduct = override.deduct || 0;
    const workDays = override.workDays || 26;
    return { ...calcSalary(staff, bonus, deduct, workDays), bonus, deduct, workDays };
  };

  const saveSalaryRecords = () => {
    const records = (data.staffs || []).map(staff => {
      const override = salaryData[staff.id] || {};
      const bonus = Number(override.bonus || 0);
      const deduct = Number(override.deduct || 0);
      const workDays = Number(override.workDays || 26);
      const calc = calcSalary(staff, bonus, deduct, workDays);
      return {
        id: `sr-${salaryMonth}-${staff.id}`,
        month: salaryMonth, staffId: staff.id, staffName: staff.name,
        position: staff.position, basicSalary: staff.basicSalary,
        allowance: staff.allowance, bonus, deduct, workDays,
        grossBase: calc.grossBase, gross: calc.gross,
        bhxhEmpAmt: calc.bhxhEmpAmt, bhytEmpAmt: calc.bhytEmpAmt, bhtnEmpAmt: calc.bhtnEmpAmt,
        bhxhEmp: calc.bhxhEmp, netSalary: calc.net,
        bhxhCompany: calc.bhxhCoAmt, bhytCompany: calc.bhytCoAmt, bhtnCompany: calc.bhtnCoAmt, bhxhCo: calc.bhxhCo,
        totalCostToCompany: calc.gross + calc.bhxhCo, status: "Đã duyệt"
      };
    });
    // Remove old records for this month and add new ones
    const others = (data.salaryRecords || []).filter(s => s.month !== salaryMonth);
    update("salaryRecords", [...others, ...records]);
    showToast(`Đã lưu bảng lương tháng ${salaryMonth}`);
    setModal(null);
  };

  // Staff CRUD
  const saveStaff = () => {
    if (!staffForm.name) return showToast("Nhập tên nhân viên", "error");
    const exists = (data.staffs || []).find(s => s.id === staffForm.id);
    const updated = exists ? (data.staffs || []).map(s => s.id === staffForm.id ? staffForm : s) : [...(data.staffs || []), { ...staffForm, id: generateId() }];
    update("staffs", updated);
    showToast(exists ? "Đã cập nhật nhân viên" : "Đã thêm nhân viên");
    setModal(null);
  };
  const delStaff = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa nhân viên này?")) return;
    update("staffs", (data.staffs || []).filter(s => s.id !== id));
    showToast("Đã xóa");
  };

  // Expense CRUD
  const saveExp = () => {
    if (!expForm.category || !expForm.amount) return showToast("Nhập danh mục và số tiền", "error");
    const id = expForm.id || generateId();
    const saved = { ...expForm, id };
    const exists = (data.operatingExpenses || []).find(e => e.id === expForm.id);
    const updated = exists ? (data.operatingExpenses || []).map(e => e.id === expForm.id ? saved : e) : [...(data.operatingExpenses || []), saved];
    update("operatingExpenses", updated);
    showToast(exists ? "Đã cập nhật chi phí" : "Đã thêm chi phí");
    setModal(null);
  };
  const delExp = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa khoản chi này?")) return;
    update("operatingExpenses", (data.operatingExpenses || []).filter(e => e.id !== id));
    showToast("Đã xóa");
  };

  const filteredExp = (data.operatingExpenses || []).filter(e =>
    e.description?.toLowerCase().includes(expSearch.toLowerCase()) || e.category?.toLowerCase().includes(expSearch.toLowerCase())
  ).sort((a, b) => b.date?.localeCompare(a.date));

  const totalExp = filteredExp.reduce((s, e) => s + (Number(e.amount) || 0), 0);

  // Summary stats
  const totalStaffActive = (data.staffs || []).filter(s => s.status === "active").length;
  const latestSalary = (data.salaryRecords || []).filter(s => {
    const n = new Date(); return s.month === `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  });

                          onChange={e => setSalaryData(d => ({ ...d, [staff.id]: { ...d[staff.id], bonus: e.target.value } }))}
                          style={{ width: 90, padding: "4px", border: "1px solid #ddd", borderRadius: 4, fontSize: 12 }} />
                      </td>
                      <td style={{ padding: "6px 8px" }}>
                        <input type="number" min={0} value={deduct}
                          onChange={e => setSalaryData(d => ({ ...d, [staff.id]: { ...d[staff.id], deduct: e.target.value } }))}
                          style={{ width: 80, padding: "4px", border: "1px solid #ddd", borderRadius: 4, fontSize: 12 }} />
                      </td>
                      <td style={{ padding: "8px 10px" }}>{formatCurrency(staff.basicSalary)}</td>
                      <td style={{ padding: "8px 10px", fontWeight: 700 }}>{formatCurrency(calc.gross)}</td>
                      <td style={{ padding: "8px 10px", color: "#c62828" }}>{formatCurrency(calc.bhxhEmp)}</td>
                      <td style={{ padding: "8px 10px", fontWeight: 800, color: "#2e7d32", fontSize: 13 }}>{formatCurrency(calc.net)}</td>
                      <td style={{ padding: "8px 10px", color: "#7b1fa2" }}>{formatCurrency(calc.bhxhCo)}</td>
                      <td style={{ padding: "8px 10px", fontWeight: 800, color: "#c62828" }}>{formatCurrency(calc.gross + calc.bhxhCo)}</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{ background: "#e8eaf6", fontWeight: 800 }}>
                  <td colSpan={5} style={{ padding: "10px", color: "#1a237e" }}>TỔNG CỘNG</td>
                  <td style={{ padding: "10px" }}>{formatCurrency((data.staffs||[]).filter(s=>s.status==="active").reduce((s,st)=>{ const c=calcSalary(st,Number((salaryData[st.id]||{}).bonus||0),Number((salaryData[st.id]||{}).deduct||0),Number((salaryData[st.id]||{}).workDays||26)); return s+c.gross; },0))}</td>
                  <td style={{ padding: "10px", color: "#c62828" }}>{formatCurrency((data.staffs||[]).filter(s=>s.status==="active").reduce((s,st)=>{ const c=calcSalary(st,Number((salaryData[st.id]||{}).bonus||0),Number((salaryData[st.id]||{}).deduct||0),Number((salaryData[st.id]||{}).workDays||26)); return s+c.bhxhEmp; },0))}</td>
                  <td style={{ padding: "10px", color: "#2e7d32", fontSize: 14 }}>{formatCurrency((data.staffs||[]).filter(s=>s.status==="active").reduce((s,st)=>{ const c=calcSalary(st,Number((salaryData[st.id]||{}).bonus||0),Number((salaryData[st.id]||{}).deduct||0),Number((salaryData[st.id]||{}).workDays||26)); return s+c.net; },0))}</td>
                  <td style={{ padding: "10px", color: "#7b1fa2" }}>{formatCurrency((data.staffs||[]).filter(s=>s.status==="active").reduce((s,st)=>{ const c=calcSalary(st,Number((salaryData[st.id]||{}).bonus||0),Number((salaryData[st.id]||{}).deduct||0),Number((salaryData[st.id]||{}).workDays||26)); return s+c.bhxhCo; },0))}</td>
                  <td style={{ padding: "10px", color: "#c62828", fontSize: 14 }}>{formatCurrency((data.staffs||[]).filter(s=>s.status==="active").reduce((s,st)=>{ const c=calcSalary(st,Number((salaryData[st.id]||{}).bonus||0),Number((salaryData[st.id]||{}).deduct||0),Number((salaryData[st.id]||{}).workDays||26)); return s+c.gross+c.bhxhCo; },0))}</td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={saveSalaryRecords}>💾 Xác nhận & Lưu bảng lương</Btn>
          </div>
        </Modal>
      )}

      {modal === "expense" && (
        <Modal title={expForm.id ? "Cập nhật chi phí" : "Ghi nhận chi phí vận hành"} onClose={() => setModal(null)} width={520}>
          <Grid cols={2} gap={12}>
            <Input label="Ngày" value={expForm.date} onChange={v => setExpForm({ ...expForm, date: v })} type="date" />
            <Input label="Danh mục" value={expForm.category} onChange={v => setExpForm({ ...expForm, category: v })} options={EXPENSE_CATS} required />
            <Input label="Mô tả chi phí" value={expForm.description} onChange={v => setExpForm({ ...expForm, description: v })} style={{ gridColumn: "span 2" }} required />
            <Input label="Số tiền (đ)" value={expForm.amount} onChange={v => setExpForm({ ...expForm, amount: v })} type="number" required />
            <Input label="Hình thức thanh toán" value={expForm.paymentMethod} onChange={v => setExpForm({ ...expForm, paymentMethod: v })} options={["Tiền mặt", "Chuyển khoản", "Thẻ", "Khác"]} />
            <Input label="Ghi chú" value={expForm.notes} onChange={v => setExpForm({ ...expForm, notes: v })} style={{ gridColumn: "span 2" }} />
          </Grid>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={saveExp}>💾 Lưu chi phí</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ===================== REPORTS PAGE =====================
function ReportsPage({ data }) {
  const revenue = data.repairOrders
    .filter(r => r.status === "Hoàn thành" || r.status === "Đã xuất xưởng")
    .reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);

  const byStatus = {};
  data.repairOrders.forEach(r => { byStatus[r.status] = (byStatus[r.status] || 0) + 1; });

  const byTech = data.technicians.map(t => ({
    name: t.name,
    count: data.repairOrders.filter(r => r.technicianId === t.id).length,
    done: data.repairOrders.filter(r => r.technicianId === t.id && (r.status === "Hoàn thành" || r.status === "Đã xuất xưởng")).length,
    rev: data.repairOrders.filter(r => r.technicianId === t.id && (r.status === "Hoàn thành" || r.status === "Đã xuất xưởng")).reduce((s, r) => s + (Number(r.totalAmount) || 0), 0)
  }));

  const waiting = data.repairOrders.filter(r => r.status !== "Đã xuất xưởng" && r.status !== "Hoàn thành" && r.status !== "Huỷ");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        <StatCard label="Tổng lệnh SC" value={data.repairOrders.length} icon="🔧" color="#1a237e" />
        <StatCard label="Xe trong kho" value={waiting.length} icon="🚗" color="#f57c00" sub="Đang sửa / chờ" />
        <StatCard label="Tổng khách hàng" value={data.customers.length} icon="👤" color="#2e7d32" />
        <StatCard label="Tổng doanh thu" value={formatCurrency(revenue)} icon="💰" color="#1565c0" />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <Card>
          <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12 }}>📊 Lệnh SC theo trạng thái</div>
          {Object.entries(byStatus).map(([s, n]) => (
            <div key={s} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #f5f5f5" }}>
              <StatusBadge status={s} />
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 120, height: 8, background: "#eee", borderRadius: 4, overflow: "hidden" }}>
                  <div style={{ width: `${(n / data.repairOrders.length * 100)}%`, height: "100%", background: "#1a237e", borderRadius: 4 }} />
                </div>
                <span style={{ fontWeight: 700 }}>{n}</span>
              </div>
            </div>
          ))}
        </Card>

        <Card>
          <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12 }}>👨‍🔧 Hiệu suất kỹ thuật viên</div>
          <Table
            headers={["KTV", "Tổng lệnh", "Hoàn thành", "Doanh thu"]}
            rows={byTech.map(t => [
              <span style={{ fontWeight: 700 }}>{t.name}</span>,
              t.count, t.done,
              <span style={{ fontWeight: 700, color: "#2e7d32" }}>{formatCurrency(t.rev)}</span>
            ])}
            emptyMsg="Chưa có dữ liệu"
          />
        </Card>
      </div>

      <Card>
        <div style={{ fontWeight: 700, color: "#f57c00", marginBottom: 12, fontSize: 15 }}>🚗 Xe tồn trong garage</div>
        <Table
          headers={["Biển số", "Tên xe", "Khách hàng", "Ngày tiếp nhận", "Triệu chứng", "KTV phụ trách", "Trạng thái"]}
          rows={waiting.map(r => {
            const v = data.vehicles.find(v => v.id === r.vehicleId);
            const c = data.customers.find(c => c.id === r.customerId);
            const t = data.technicians.find(t => t.id === r.technicianId);
            const days = Math.ceil((new Date() - new Date(r.receiveDate)) / 86400000);
            return [
              <span style={{ fontWeight: 700, color: "#1a237e" }}>{v?.licensePlate || "-"}</span>,
              v?.vehicleName || "-", c?.name || "-",
              <span>{formatDate(r.receiveDate)} <span style={{ color: days > 3 ? "#c62828" : "#2e7d32", fontSize: 11 }}>({days} ngày)</span></span>,
              r.symptoms.slice(0, 40), t?.name || "-",
              <StatusBadge status={r.status} />
            ];
          })}
          emptyMsg="Không có xe nào đang trong garage ✅"
        />
      </Card>

      <Card>
        <div style={{ fontWeight: 700, color: "#2e7d32", marginBottom: 12, fontSize: 15 }}>🚪 Xe đã xuất xưởng</div>
        <Table
          headers={["Biển số", "Tên xe", "Khách hàng", "Ngày xuất", "Tổng thanh toán", "Đã thu"]}
          rows={data.repairOrders.filter(r => r.status === "Đã xuất xưởng").map(r => {
            const v = data.vehicles.find(v => v.id === r.vehicleId);
            const c = data.customers.find(c => c.id === r.customerId);
            return [
              <span style={{ fontWeight: 700 }}>{v?.licensePlate || "-"}</span>,
              v?.vehicleName || "-", c?.name || "-",
              formatDate(r.actualDone || r.receiveDate),
              <span style={{ fontWeight: 700, color: "#2e7d32" }}>{formatCurrency(r.totalAmount)}</span>,
              formatCurrency(r.paid)
            ];
          })}
          emptyMsg="Chưa có xe xuất xưởng"
        />
      </Card>
    </div>
  );
}

// ===================== ALERTS PAGE =====================
function AlertsPage({ data, alerts, setPage }) {
  const allVehicles = data.vehicles.map(v => {
    const cust = data.customers.find(c => c.id === v.customerId);
    const regDays = daysUntil(v.registrationExpiry);
    const insDays = daysUntil(v.insuranceExpiry);
    const maintKm = v.nextMaintenanceKm ? (Number(v.nextMaintenanceKm) - Number(v.currentKm)) : null;
    return { ...v, cust, regDays, insDays, maintKm };
  }).sort((a, b) => (a.regDays || 999) - (b.regDays || 999));

  const alertColor = (days) => {
    if (days === null) return "#aaa";
    if (days < 0) return "#c62828";
    if (days <= 15) return "#c62828";
    if (days <= 30) return "#f57c00";
    return "#2e7d32";
  };
  const alertText = (days, label) => {
    if (days === null) return `Chưa nhập ${label}`;
    if (days < 0) return `Đã hết hạn ${Math.abs(days)} ngày`;
    if (days === 0) return `Hết hạn HÔM NAY ⚠️`;
    return `Còn ${days} ngày`;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14 }}>
        <StatCard label="Đăng kiểm đã hết hạn" value={allVehicles.filter(v => v.regDays !== null && v.regDays < 0).length} icon="❌" color="#c62828" />
        <StatCard label="Đăng kiểm trong 30 ngày" value={allVehicles.filter(v => v.regDays !== null && v.regDays >= 0 && v.regDays <= 30).length} icon="⚠️" color="#f57c00" />
        <StatCard label="Bảo hiểm đã hết hạn" value={allVehicles.filter(v => v.insDays !== null && v.insDays < 0).length} icon="❌" color="#c62828" />
      </div>

      <Card>
        <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12, fontSize: 15 }}>🔔 Trạng thái hạn xe toàn hệ thống</div>
        <Table
          headers={["Biển số", "Tên xe", "Khách hàng", "SĐT", "Đăng kiểm", "Bảo hiểm", "Km bảo dưỡng còn lại"]}
          rows={allVehicles.map(v => [
            <span style={{ fontWeight: 800, color: "#1a237e" }}>{v.licensePlate}</span>,
            v.vehicleName,
            v.cust?.name || "-",
            v.cust?.phone || "-",
            <div>
              <div style={{ fontSize: 11, color: "#666" }}>{formatDate(v.registrationExpiry)}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: alertColor(v.regDays) }}>{alertText(v.regDays, "đăng kiểm")}</div>
            </div>,
            <div>
              <div style={{ fontSize: 11, color: "#666" }}>{formatDate(v.insuranceExpiry)}</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: alertColor(v.insDays) }}>{alertText(v.insDays, "bảo hiểm")}</div>
            </div>,
            v.maintKm !== null
              ? <span style={{ color: v.maintKm <= 1000 ? "#c62828" : v.maintKm <= 5000 ? "#f57c00" : "#2e7d32", fontWeight: 700 }}>
                {v.maintKm <= 0 ? "Quá hạn!" : `${Number(v.maintKm).toLocaleString()} km`}
              </span>
              : <span style={{ color: "#aaa" }}>Chưa thiết lập</span>
          ])}
          emptyMsg="Không có xe nào"
        />
      </Card>
    </div>
  );
}

root.render(<SicoAuto />);
</script>
