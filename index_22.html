};

const doPrint = (content, title) => {
  const printWin = window.open("about:blank", "print_" + Date.now(), "width=800,height=600,scrollbars=yes");
  if (!printWin) {
    alert("Popup bị chặn!\nVui lòng nhấn vào icon 🚫 góc trên phải trình duyệt → Luôn cho phép popup từ trang này → thử lại.");
    return;
  }
  const full = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>" + (title||"SICO AUTO - In phiếu") + "</title></head>"
    + "<body style='margin:0;padding:0'>" + content
    + "<script>window.onload=function(){setTimeout(function(){window.print();window.onafterprint=function(){window.close();};},500);};<\/script>"
    + "</body></html>";
  printWin.document.write(full);
  printWin.document.close();
};

function SettingsPage({ data, update, showToast }) {
  const s = data.settings || {};
  const [tab, setTab] = React.useState("garage");
  const [form, setForm] = React.useState({
    garageName: s.garageName||"CTY TNHH TMDV SICO AUTO", garageAddress: s.garageAddress||"", garagePhone: s.garagePhone||"", garageEmail: s.garageEmail||"", garageBankAccount: s.garageBankAccount||"", garageReceiver: s.garageReceiver||"",
    appTitle: s.appTitle||"SICO AUTO", appSubtitle: s.appSubtitle||"Hệ thống quản lý Garage",
    defaultLaborRate: s.defaultLaborRate||150000, defaultVatType: s.defaultVatType||"no_vat",
    alertDaysReg: s.alertDaysReg||30, alertDaysIns: s.alertDaysIns||30, alertKm: s.alertKm||1000, minStock: s.minStock||5,
    warranty: s.warranty||"", repairFooterNote: s.repairFooterNote||"",
  });
  const save = () => { update("settings", form); showToast("✅ Đã lưu cài đặt!"); };
  const inp = (k, ph) => <input value={form[k]||""} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={ph||""} style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:13,boxSizing:"border-box"}} />;
  const num = (k) => <input type="number" value={form[k]||0} onChange={e=>setForm({...form,[k]:Number(e.target.value)})} style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:13}} />;
  const lbl = (t,s) => <div style={{marginBottom:4}}><label style={{fontSize:12,fontWeight:600,color:"#555"}}>{t}</label>{s&&<div style={{fontSize:11,color:"#aaa"}}>{s}</div>}</div>;
  const sec = (t) => <div style={{fontWeight:700,color:"#1a237e",padding:"5px 10px",background:"#e8eaf6",borderLeft:"4px solid #1a237e",borderRadius:4,marginBottom:14}}>{t}</div>;
  const TABS = [{id:"garage",label:"🏢 Thông tin Garage"},{id:"quotes",label:"🧾 Báo giá"},{id:"repair",label:"🔧 Lệnh SC"},{id:"alerts",label:"🔔 Cảnh báo"},{id:"display",label:"🎨 Hiển thị"},{id:"warranty",label:"📋 Điều khoản BH"}];
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <Card><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"7px 14px",border:"2px solid "+(tab===t.id?"#1a237e":"#ddd"),borderRadius:20,background:tab===t.id?"#1a237e":"#fff",color:tab===t.id?"#fff":"#666",fontWeight:600,cursor:"pointer",fontSize:13}}>{t.label}</button>)}</div></Card>
      {tab==="garage"&&<Card>{sec("🏢 Thông tin Garage")}<Grid cols={2} gap={12}><div>{lbl("Tên garage")}{inp("garageName")}</div><div>{lbl("Điện thoại")}{inp("garagePhone")}</div><div style={{gridColumn:"1/-1"}}>{lbl("Địa chỉ")}{inp("garageAddress")}</div><div>{lbl("Email")}{inp("garageEmail")}</div><div>{lbl("Người tiếp nhận")}{inp("garageReceiver")}</div><div style={{gridColumn:"1/-1"}}>{lbl("Số tài khoản ngân hàng")}{inp("garageBankAccount")}</div></Grid></Card>}
      {tab==="quotes"&&<Card>{sec("🧾 Cài đặt Báo giá")}<Grid cols={2} gap={12}><div>{lbl("Đơn giá giờ công (đ/h)")}{num("defaultLaborRate")}</div><div>{lbl("VAT mặc định")}<select value={form.defaultVatType} onChange={e=>setForm({...form,defaultVatType:e.target.value})} style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:13}}><option value="no_vat">Chưa bao gồm VAT</option><option value="vat8">+ VAT 8%</option><option value="vat10">+ VAT 10%</option><option value="included">Đã bao gồm VAT</option></select></div></Grid></Card>}
      {tab==="repair"&&<Card>{sec("🔧 Lệnh sửa chữa")}{lbl("Ghi chú cuối phiếu SC")}<textarea value={form.repairFooterNote||""} onChange={e=>setForm({...form,repairFooterNote:e.target.value})} rows={4} style={{width:"100%",padding:"8px 10px",border:"1px solid #ddd",borderRadius:6,fontSize:13,resize:"vertical",boxSizing:"border-box"}} /></Card>}
      {tab==="alerts"&&<Card>{sec("🔔 Cài đặt Cảnh báo")}<Grid cols={2} gap={12}><div>{lbl("Cảnh báo đăng kiểm (ngày)")}{num("alertDaysReg")}</div><div>{lbl("Cảnh báo bảo hiểm (ngày)")}{num("alertDaysIns")}</div><div>{lbl("Cảnh báo bảo dưỡng (km)")}{num("alertKm")}</div><div>{lbl("Tồn kho tối thiểu")}{num("minStock")}</div></Grid></Card>}
      {tab==="display"&&<Card>{sec("🎨 Hiển thị")}<Grid cols={2} gap={12}><div>{lbl("Tên sidebar")}{inp("appTitle")}</div><div>{lbl("Mô tả phụ")}{inp("appSubtitle")}</div></Grid></Card>}
      {tab==="warranty"&&<Card>{sec("📋 Điều khoản bảo hành")}<div style={{fontSize:12,color:"#666",marginBottom:8}}>Tự động điền vào mỗi báo giá mới.</div><textarea value={form.warranty||""} onChange={e=>setForm({...form,warranty:e.target.value})} rows={10} style={{width:"100%",padding:"10px",border:"1px solid #c5cae9",borderRadius:6,fontSize:13,resize:"vertical",boxSizing:"border-box",lineHeight:1.8}} placeholder="Mỗi dòng một điều khoản..." /><div style={{fontSize:11,color:"#aaa",marginTop:4}}>Mỗi dòng một điều khoản.</div></Card>}
      <div style={{display:"flex",justifyContent:"flex-end"}}><Btn onClick={save}>💾 Lưu tất cả cài đặt</Btn></div>
    </div>
  );
}

function SicoAuto() {
  const [data, setData] = useStorage();
  const [page, setPage] = useState("dashboard");
  const [toast, setToast] = useState(null);

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  };

  const update = (key, items) => {
    const newData = { ...data, [key]: items };
    setData(newData);
  };

  // ---- ALERTS ----
  const alerts = [];
  data.vehicles.forEach(v => {
    const reg = daysUntil(v.registrationExpiry);
    const ins = daysUntil(v.insuranceExpiry);
    const cust = data.customers.find(c => c.id === v.customerId);
    if (alertLevel(reg) === "danger" || alertLevel(reg) === "expired")
      alerts.push({ type: "reg", vehicle: v, customer: cust, days: reg, label: "Đăng kiểm" });
    if (alertLevel(ins) === "danger" || alertLevel(ins) === "expired")
      alerts.push({ type: "ins", vehicle: v, customer: cust, days: ins, label: "Bảo hiểm" });
  });

  const nav = [
    { id: "dashboard", label: "Tổng quan", icon: "dashboard" },
    { id: "vehicles", label: "Tiếp nhận xe", icon: "car" },
    { id: "customers", label: "Khách hàng", icon: "customer" },
    { id: "repair", label: "Lệnh sửa chữa", icon: "wrench" },
    { id: "quotes", label: "Báo giá", icon: "invoice" },
    { id: "parts", label: "Vật tư - Kho", icon: "parts" },
    { id: "technicians", label: "Kỹ thuật viên", icon: "technician" },
    { id: "accounting", label: "Kế toán", icon: "money" },
    { id: "reports", label: "Báo cáo", icon: "report" },
    { id: "expenses", label: "Chi phí vận hành", icon: "money" },
    { id: "alerts", label: `Nhắc nhở ${alerts.length > 0 ? "🔴" : ""}`, icon: "bell" },
    { id: "settings_page", label: "⚙️ Cài đặt", icon: "bell" },
  ];

  const pages = {
    dashboard: <Dashboard data={data} setPage={setPage} alerts={alerts} />,
    vehicles: <VehiclesPage data={data} update={update} showToast={showToast} />,
    customers: <CustomersPage data={data} update={update} showToast={showToast} />,
    repair: <RepairPage data={data} update={update} showToast={showToast} />,
    quotes: <QuotesPage data={data} update={update} showToast={showToast} />,
    parts: <PartsPage data={data} update={update} showToast={showToast} />,
    technicians: <TechniciansPage data={data} update={update} showToast={showToast} />,
    accounting: <AccountingPage data={data} />,
    reports: <ReportsPage data={data} />,
    expenses: <ExpensesPage data={data} update={update} showToast={showToast} />,
    alerts: <AlertsPage data={data} alerts={alerts} setPage={setPage} />,
    settings_page: <SettingsPage data={data} update={update} showToast={showToast} />,
  };

  return (
    <div style={{ display: "flex", height: "100vh", fontFamily: "'Segoe UI', sans-serif", background: "#f0f2f5", overflow: "hidden" }}>
      {/* SIDEBAR */}
      <div style={{ width: 220, background: "linear-gradient(180deg,#1a237e 0%,#283593 60%,#1565c0 100%)", color: "#fff", display: "flex", flexDirection: "column", flexShrink: 0 }}>
        <div style={{ padding: "14px 16px 12px", borderBottom: "1px solid rgba(255,255,255,0.15)" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <img src={LOGO_IMG} alt="SICO AUTO" style={{ width: 44, height: 44, borderRadius: "50%", border: "2px solid rgba(255,255,255,0.3)" }} />
            <div>
              <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: 1, color: "#fff" }}>SICO AUTO</div>
              <div style={{ fontSize: 10, color: "#90caf9", marginTop: 1 }}>Hệ thống quản lý Garage</div>
            </div>
          </div>
        </div>
        <nav style={{ flex: 1, padding: "8px 0", overflowY: "auto" }}>
          {nav.map(n => (
            <div key={n.id} onClick={() => setPage(n.id)}
              style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 18px", cursor: "pointer", fontSize: 13, fontWeight: page === n.id ? 700 : 400, background: page === n.id ? "rgba(255,255,255,0.18)" : "transparent", borderLeft: page === n.id ? "3px solid #64b5f6" : "3px solid transparent", color: page === n.id ? "#fff" : "#bbdefb", transition: "all .15s" }}>
              <Icon name={n.icon} size={15} /> {n.label}
            </div>
          ))}
        </nav>
        <div style={{ padding: "12px 16px", borderTop: "1px solid rgba(255,255,255,0.15)" }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <button onClick={() => { const j=JSON.stringify(data,null,2); const b=new Blob([j],{type:"application/json"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="sico-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); URL.revokeObjectURL(u); }} style={{ flex:1, padding:"8px 4px", background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:6, color:"#fff", fontSize:11, fontWeight:600, cursor:"pointer" }}>📤 Xuất data</button>
            <label style={{ flex:1, padding:"8px 4px", background:"rgba(255,255,255,0.15)", border:"1px solid rgba(255,255,255,0.3)", borderRadius:6, color:"#fff", fontSize:11, fontWeight:600, cursor:"pointer", textAlign:"center", display:"flex", alignItems:"center", justifyContent:"center" }}>📥 Nhập data<input type="file" accept=".json" style={{ display:"none" }} onChange={e => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); if(window.confirm("Nhập data sẽ GHI ĐÈ. Tiếp tục?")){ Object.keys(d).forEach(k=>update(k,d[k])); alert("Nhập thành công!"); } }catch(err){alert("File lỗi!");} }; r.readAsText(f); e.target.value=""; }} /></label>
          </div>
          <div style={{ fontSize: 11, color: "#90caf9", textAlign: "center" }}>© 2026 SICO AUTO v1.0</div>
        </div>
      </div>
      {/* MAIN */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
        <header style={{ background: "#fff", borderBottom: "1px solid #e0e0e0", padding: "0 24px", height: 52, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 16, color: "#1a237e" }}>{nav.find(n => n.id === page)?.label}</div>
          <div style={{ fontSize: 12, color: "#666" }}>{new Date().toLocaleDateString("vi-VN", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</div>
        </header>
        <main style={{ flex: 1, overflow: "auto", padding: 20 }}>
          {pages[page] || <div>Trang không tồn tại</div>}
        </main>
      </div>
      {/* TOAST */}
      {toast && (
        <div style={{ position: "fixed", bottom: 24, right: 24, background: toast.type === "success" ? "#43a047" : "#e53935", color: "#fff", padding: "12px 20px", borderRadius: 8, fontSize: 14, fontWeight: 600, zIndex: 9999, boxShadow: "0 4px 16px rgba(0,0,0,0.2)" }}>
          {toast.type === "success" ? "✅" : "❌"} {toast.msg}
        </div>
      )}
    </div>
  );
}

// ===================== SHARED COMPONENTS =====================
const Card = ({ children, style = {} }) => (
  <div style={{ background: "#fff", borderRadius: 10, padding: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.08)", ...style }}>{children}</div>
);

const StatCard = ({ label, value, icon, color = "#1a237e", sub }) => (
  <div style={{ background: "#fff", borderRadius: 10, padding: "16px 20px", boxShadow: "0 1px 4px rgba(0,0,0,0.08)", borderLeft: `4px solid ${color}` }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
      <div>
        <div style={{ fontSize: 12, color: "#888", fontWeight: 600, marginBottom: 4 }}>{label}</div>
        <div style={{ fontSize: 26, fontWeight: 800, color }}>{value}</div>
        {sub && <div style={{ fontSize: 11, color: "#aaa", marginTop: 2 }}>{sub}</div>}
      </div>
      <span style={{ fontSize: 28 }}>{icon}</span>
    </div>
  </div>
);

const Btn = ({ children, onClick, color = "#1a237e", outline, size = "md", disabled, style = {} }) => {
  const pad = size === "sm" ? "5px 12px" : "9px 18px";
  const fs = size === "sm" ? 12 : 13;
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ padding: pad, fontSize: fs, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", borderRadius: 6, border: `2px solid ${color}`, background: outline ? "transparent" : color, color: outline ? color : "#fff", opacity: disabled ? 0.5 : 1, transition: "all .15s", ...style }}>
      {children}
    </button>
  );
};

const Input = ({ label, value, onChange, type = "text", placeholder, required, options, style = {} }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 4, ...style }}>
    {label && <label style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>{label}{required && <span style={{ color: "red" }}> *</span>}</label>}
    {options ? (
      <select value={value} onChange={e => onChange(e.target.value)}
        style={{ padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, background: "#fff" }}>
        <option value="">-- Chọn --</option>
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    ) : (
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        style={{ padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13 }} />
    )}
  </div>
);

const Table = ({ headers, rows, emptyMsg = "Không có dữ liệu" }) => (
  <div style={{ overflowX: "auto" }}>
    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
      <thead>
        <tr style={{ background: "#e8eaf6" }}>
          {headers.map((h, i) => <th key={i} style={{ padding: "10px 12px", textAlign: "left", fontWeight: 700, color: "#1a237e", whiteSpace: "nowrap", borderBottom: "2px solid #c5cae9" }}>{h}</th>)}
        </tr>
      </thead>
      <tbody>
        {rows.length === 0 ? (
          <tr><td colSpan={headers.length} style={{ padding: 24, textAlign: "center", color: "#aaa" }}>{emptyMsg}</td></tr>
        ) : rows.map((row, i) => (
          <tr key={i} style={{ borderBottom: "1px solid #f0f0f0", background: i % 2 === 0 ? "#fff" : "#fafafa" }}>
            {row.map((cell, j) => <td key={j} style={{ padding: "9px 12px" }}>{cell}</td>)}
          </tr>
        ))}
      </tbody>
    </table>
  </div>
);

const Badge = ({ label, color = "#1a237e", bg }) => (
  <span style={{ background: bg || color + "18", color, fontSize: 11, fontWeight: 700, padding: "3px 8px", borderRadius: 20, border: `1px solid ${color}40` }}>{label}</span>
);

const StatusBadge = ({ status }) => {
  const map = {
    "Tiếp nhận": ["#f57c00", "#fff3e0"],
    "Đang sửa": ["#1565c0", "#e3f2fd"],
    "Chờ phụ tùng": ["#6a1b9a", "#f3e5f5"],
    "Hoàn thành": ["#2e7d32", "#e8f5e9"],
    "Đã xuất xưởng": ["#546e7a", "#eceff1"],
    "Huỷ": ["#c62828", "#ffebee"],
  };
  const [c, bg] = map[status] || ["#666", "#eee"];
  return <Badge label={status} color={c} bg={bg} />;
};

// ===================== MODAL =====================
const Modal = ({ title, children, onClose, width = 640 }) => (
  <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
    <div style={{ background: "#fff", borderRadius: 12, width: "100%", maxWidth: width, maxHeight: "92vh", overflow: "auto", boxShadow: "0 8px 40px rgba(0,0,0,0.25)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", borderBottom: "1px solid #eee", position: "sticky", top: 0, background: "#fff", zIndex: 1 }}>
        <div style={{ fontWeight: 700, fontSize: 16, color: "#1a237e" }}>{title}</div>
        <button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: "#666" }}>✕</button>
      </div>
      <div style={{ padding: 20 }}>{children}</div>
    </div>
  </div>
);

const Grid = ({ cols = 2, children, gap = 12 }) => (
  <div style={{ display: "grid", gridTemplateColumns: `repeat(${cols}, 1fr)`, gap }}>{children}</div>
);

// ===================== DASHBOARD =====================
function Dashboard({ data, setPage, alerts }) {
  const pending = data.repairOrders.filter(r => r.status !== "Đã xuất xưởng" && r.status !== "Huỷ");
  const done = data.repairOrders.filter(r => r.status === "Hoàn thành" || r.status === "Đã xuất xưởng");
  const revenue = done.reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
  const lowStock = data.parts.filter(p => p.stock <= p.minStock);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        <StatCard label="Tổng xe đang sửa" value={pending.length} icon="🔧" color="#1565c0" sub={`${data.vehicles.length} xe trong hệ thống`} />
        <StatCard label="Khách hàng" value={data.customers.length} icon="👤" color="#2e7d32" sub="Đang hoạt động" />
        <StatCard label="Doanh thu tháng" value={formatCurrency(revenue)} icon="💰" color="#f57c00" sub="Các lệnh hoàn thành" />
        <StatCard label="Nhắc nhở" value={alerts.length} icon="🔔" color={alerts.length > 0 ? "#c62828" : "#546e7a"} sub="Đăng kiểm / Bảo hiểm" />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 14 }}>
        <Card>
          <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 14, fontSize: 15 }}>🔧 Lệnh sửa chữa đang xử lý</div>
          <Table
            headers={["Mã LSC", "Biển số", "Khách hàng", "Triệu chứng", "Trạng thái", "KTV"]}
            rows={pending.slice(0, 6).map(r => {
              const v = data.vehicles.find(v => v.id === r.vehicleId);
              const c = data.customers.find(c => c.id === r.customerId);
              const t = data.technicians.find(t => t.id === r.technicianId);
              return [
                <span style={{ fontWeight: 700 }}>#{r.id.slice(-4).toUpperCase()}</span>,
                v?.licensePlate || "-", c?.name || "-",
                r.symptoms.slice(0, 40) + (r.symptoms.length > 40 ? "..." : ""),
                <StatusBadge status={r.status} />, t?.name || "-"
              ];
            })}
            emptyMsg="Không có lệnh sửa chữa nào đang xử lý"
          />
        </Card>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Card>
            <div style={{ fontWeight: 700, color: "#c62828", marginBottom: 10, fontSize: 15 }}>⚠️ Vật tư sắp hết</div>
            {lowStock.length === 0 ? <div style={{ color: "#aaa", fontSize: 13 }}>Kho đầy đủ ✅</div> :
              lowStock.slice(0, 5).map(p => (
                <div key={p.id} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "1px solid #f5f5f5", fontSize: 13 }}>
                  <span>{p.name}</span>
                  <Badge label={`${p.stock} ${p.unit}`} color="#c62828" />
                </div>
              ))}
          </Card>
          <Card>
            <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 10, fontSize: 15 }}>🔔 Nhắc nhở sắp hết hạn</div>
            {alerts.length === 0 ? <div style={{ color: "#aaa", fontSize: 13 }}>Không có nhắc nhở ✅</div> :
              alerts.slice(0, 4).map((a, i) => (
                <div key={i} style={{ padding: "6px 0", borderBottom: "1px solid #f5f5f5", fontSize: 12 }}>
                  <div style={{ fontWeight: 700, color: "#c62828" }}>{a.vehicle?.licensePlate}</div>
                  <div style={{ color: "#666" }}>{a.label}: {a.days < 0 ? `Đã hết hạn ${Math.abs(a.days)} ngày` : `Còn ${a.days} ngày`}</div>
                </div>
              ))}
          </Card>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 12 }}>
        {[
          { label: "Tiếp nhận xe mới", icon: "🚗", page: "vehicles", color: "#1565c0" },
          { label: "Tạo lệnh sửa chữa", icon: "🔧", page: "repair", color: "#2e7d32" },
          { label: "Xuất vật tư", icon: "📦", page: "parts", color: "#f57c00" },
          { label: "Báo cáo tổng hợp", icon: "📊", page: "reports", color: "#6a1b9a" },
        ].map(q => (
          <Card key={q.page} style={{ cursor: "pointer", textAlign: "center", padding: "18px 12px", borderTop: `3px solid ${q.color}` }}
            onClick={() => setPage(q.page)}>
            <div style={{ fontSize: 28, marginBottom: 6 }}>{q.icon}</div>
            <div style={{ fontWeight: 700, color: q.color, fontSize: 13 }}>{q.label}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

// ===================== CUSTOMERS PAGE =====================
function CustomersPage({ data, update, showToast }) {
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_CUSTOMER);

  const filtered = data.customers.filter(c =>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.phone.includes(search)
  );

  const openNew = () => { setForm({ ...EMPTY_CUSTOMER, id: generateId() }); setModal("form"); };
  const openEdit = (c) => { setForm({ ...c }); setModal("form"); };
  const save = () => {
    if (!form.name || !form.phone) return showToast("Vui lòng nhập tên và SĐT", "error");
    const exists = data.customers.find(c => c.id === form.id);
    const updated = exists ? data.customers.map(c => c.id === form.id ? form : c) : [...data.customers, form];
    update("customers", updated);
    showToast(exists ? "Đã cập nhật khách hàng" : "Đã thêm khách hàng");
    setModal(null);
  };
  const del = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa khách hàng này?")) return;
    update("customers", data.customers.filter(c => c.id !== id));
    showToast("Đã xóa khách hàng");
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <span style={{ fontSize: 13, color: "#666" }}>🔍</span>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm theo tên, SĐT..."
              style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 240 }} />
          </div>
          <div style={{ display:"flex", gap:6 }}>
            <Btn outline color="#1565c0" onClick={() => printCustomers(data.customers, data.settings)}>🖨️ In</Btn>
            <Btn onClick={openNew}>➕ Thêm khách hàng</Btn>
          </div>
        </div>
      </Card>
      <Card>
        <Table
          headers={["Tên khách hàng", "Điện thoại", "Địa chỉ", "Email", "Số xe", "Thao tác"]}
          rows={filtered.map(c => {
            const vehicleCount = data.vehicles.filter(v => v.customerId === c.id).length;
            return [
              <span style={{ fontWeight: 700, color: "#1a237e" }}>{c.name}</span>,
              c.phone, c.address || "-", c.email || "-",
              <Badge label={`${vehicleCount} xe`} color="#1565c0" />,
              <div style={{ display: "flex", gap: 6 }}>
                <Btn size="sm" onClick={() => openEdit(c)} outline>✏️ Sửa</Btn>
                <Btn size="sm" onClick={() => del(c.id)} color="#c62828" outline>🗑️</Btn>
              </div>
            ];
          })}
        />
      </Card>
      {modal === "form" && (
        <Modal title={form.id && data.customers.find(c => c.id === form.id) ? "Cập nhật khách hàng" : "Thêm khách hàng"} onClose={() => setModal(null)}>
          <Grid cols={2} gap={14}>
            <Input label="Họ và tên" value={form.name} onChange={v => setForm({ ...form, name: v })} required />
            <Input label="Số điện thoại" value={form.phone} onChange={v => setForm({ ...form, phone: v })} required />
            <Input label="Email" value={form.email} onChange={v => setForm({ ...form, email: v })} />
            <Input label="Địa chỉ" value={form.address} onChange={v => setForm({ ...form, address: v })} />
          </Grid>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={save}>💾 Lưu</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ===================== VEHICLES PAGE =====================
function VehiclesPage({ data, update, showToast }) {
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_VEHICLE);
  const [filter, setFilter] = useState("all");

  const filtered = data.vehicles.filter(v => {
    const q = search.toLowerCase();
    const match = v.licensePlate.toLowerCase().includes(q) || v.vehicleName.toLowerCase().includes(q) ||
      v.frameNumber.toLowerCase().includes(q) || (data.customers.find(c => c.id === v.customerId)?.name || "").toLowerCase().includes(q);
    if (!match) return false;
    if (filter === "reg") return alertLevel(daysUntil(v.registrationExpiry)) !== "ok";
    if (filter === "ins") return alertLevel(daysUntil(v.insuranceExpiry)) !== "ok";
    return true;
  });

  const openNew = () => { setForm({ ...EMPTY_VEHICLE, id: generateId() }); setModal("form"); };
  const openEdit = (v) => { setForm({ ...v }); setModal("form"); };
  const save = () => {
    if (!form.licensePlate || !form.customerId) return showToast("Vui lòng nhập biển số và chọn khách hàng", "error");
    const exists = data.vehicles.find(v => v.id === form.id);
    const updated = exists ? data.vehicles.map(v => v.id === form.id ? form : v) : [...data.vehicles, form];
    update("vehicles", updated);
    showToast(exists ? "Đã cập nhật thông tin xe" : "Đã tiếp nhận xe mới");
    setModal(null);
  };
  const del = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa xe này?")) return;
    update("vehicles", data.vehicles.filter(v => v.id !== id));
    showToast("Đã xóa xe");
  };

  const regLevel = (v) => alertLevel(daysUntil(v.registrationExpiry));
  const insLevel = (v) => alertLevel(daysUntil(v.insuranceExpiry));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Biển số, tên xe, khách hàng..."
              style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 260 }} />
            <select value={filter} onChange={e => setFilter(e.target.value)} style={{ padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13 }}>
              <option value="all">Tất cả xe</option>
              <option value="reg">⚠️ Đăng kiểm gần hết</option>
              <option value="ins">⚠️ Bảo hiểm gần hết</option>
            </select>
          </div>
          <Btn onClick={openNew}>➕ Tiếp nhận xe</Btn>
        </div>
      </Card>
      <Card>
        <Table
          headers={["Biển số", "Xe / Nhãn hiệu", "Số khung", "Số máy", "Km hiện tại", "Khách hàng", "Đăng kiểm", "Bảo hiểm", "Thao tác"]}
          rows={filtered.map(v => {
            const cust = data.customers.find(c => c.id === v.customerId);
            const rl = regLevel(v), il = insLevel(v);
            const regColor = { danger: "#c62828", expired: "#c62828", warning: "#f57c00", ok: "#2e7d32" }[rl] || "#666";
            const insColor = { danger: "#c62828", expired: "#c62828", warning: "#f57c00", ok: "#2e7d32" }[il] || "#666";
            return [
              <span style={{ fontWeight: 800, color: "#1a237e", fontSize: 14 }}>{v.licensePlate}</span>,
              <div><div style={{ fontWeight: 700 }}>{v.vehicleName}</div><div style={{ fontSize: 11, color: "#888" }}>{v.brand} · {v.type} · {v.color}</div></div>,
              <span style={{ fontSize: 11, fontFamily: "monospace" }}>{v.frameNumber}</span>,
              <span style={{ fontSize: 11, fontFamily: "monospace" }}>{v.engineNumber}</span>,
              <span>{Number(v.currentKm).toLocaleString()} km</span>,
              cust?.name || "-",
              <span style={{ color: regColor, fontWeight: 700, fontSize: 12 }}>{formatDate(v.registrationExpiry)}{rl !== "ok" && " ⚠️"}</span>,
              <span style={{ color: insColor, fontWeight: 700, fontSize: 12 }}>{formatDate(v.insuranceExpiry)}{il !== "ok" && " ⚠️"}</span>,
              <div style={{ display: "flex", gap: 4 }}>
                <Btn size="sm" onClick={() => printVehicleReceipt(v, data)} outline color="#1565c0">🖨️</Btn>
                <Btn size="sm" onClick={() => openEdit(v)} outline>✏️</Btn>
                <Btn size="sm" onClick={() => del(v.id)} color="#c62828" outline>🗑️</Btn>
              </div>
            ];
          })}
        />
      </Card>
      {modal === "form" && (
        <Modal title="Thông tin xe" onClose={() => setModal(null)} width={760}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#1a237e", marginBottom: 10 }}>📋 Thông tin cơ bản</div>
          <Grid cols={3} gap={12}>
            <Input label="Biển số xe" value={form.licensePlate} onChange={v => setForm({ ...form, licensePlate: v.toUpperCase() })} required />
            <div>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>Khách hàng <span style={{ color: "red" }}>*</span></label>
              <select value={form.customerId || ""} onChange={e => setForm({ ...form, customerId: e.target.value })}
                style={{ width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, marginTop: 4 }}>
                <option value="">-- Chọn khách hàng --</option>
                {data.customers.map(c => <option key={c.id} value={c.id}>{c.name} - {c.phone}</option>)}
              </select>
            </div>
            <Input label="Tên xe" value={form.vehicleName} onChange={v => setForm({ ...form, vehicleName: v })} />
            <Input label="Nhãn hiệu" value={form.brand} onChange={v => setForm({ ...form, brand: v })} options={VEHICLE_BRANDS} />
            <Input label="Chủng loại" value={form.type} onChange={v => setForm({ ...form, type: v })} options={VEHICLE_TYPES} />
            <Input label="Màu sắc" value={form.color} onChange={v => setForm({ ...form, color: v })} />
            <Input label="Năm sản xuất" value={form.year} onChange={v => setForm({ ...form, year: v })} />
            <Input label="Km hiện tại" value={form.currentKm} onChange={v => setForm({ ...form, currentKm: v })} type="number" />
            <Input label="Km bảo dưỡng tiếp theo" value={form.nextMaintenanceKm} onChange={v => setForm({ ...form, nextMaintenanceKm: v })} type="number" />
          </Grid>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#1a237e", margin: "14px 0 10px" }}>🔩 Số khung & Số máy</div>
          <Grid cols={2} gap={12}>
            <Input label="Số khung (VIN)" value={form.frameNumber} onChange={v => setForm({ ...form, frameNumber: v.toUpperCase() })} />
            <Input label="Số máy" value={form.engineNumber} onChange={v => setForm({ ...form, engineNumber: v.toUpperCase() })} />
          </Grid>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#1a237e", margin: "14px 0 10px" }}>📅 Ngày quan trọng</div>
          <Grid cols={3} gap={12}>
            <Input label="Ngày bảo dưỡng gần nhất" value={form.lastMaintenanceDate} onChange={v => setForm({ ...form, lastMaintenanceDate: v })} type="date" />
            <Input label="Hạn đăng kiểm" value={form.registrationExpiry} onChange={v => setForm({ ...form, registrationExpiry: v })} type="date" />
            <Input label="Hạn bảo hiểm" value={form.insuranceExpiry} onChange={v => setForm({ ...form, insuranceExpiry: v })} type="date" />
          </Grid>
          <div style={{ marginTop: 12 }}>
            <label style={{ fontSize: 12, fontWeight: 600, color: "#555" }}>Ghi chú</label>
            <textarea value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} rows={2}
              style={{ width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, marginTop: 4, resize: "vertical", boxSizing: "border-box" }} />
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 20 }}>
            {/* Ảnh xe */}
            <div style={{ gridColumn: "1/-1", marginTop: 6 }}>
              <div style={{ fontWeight: 700, color: "#1a237e", padding: "5px 10px", background: "#e8eaf6", borderLeft: "4px solid #1a237e", borderRadius: 4, marginBottom: 10 }}>
                📷 Hình ảnh xe (căn cứ pháp lý tình trạng xe)
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: "#e3f2fd", border: "1px solid #90caf9", borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#1565c0" }}>
                  📁 Chọn ảnh từ máy
                  <input type="file" accept="image/*" multiple style={{ display: "none" }} onChange={e => {
                    Array.from(e.target.files).forEach(file => {
                      const reader = new FileReader();
                      reader.onload = ev => setForm(f => ({ ...f, photos: [...(f.photos||[]), { id: Date.now()+Math.random(), data: ev.target.result, name: file.name, date: new Date().toLocaleDateString("vi-VN"), note: "" }]}));
                      reader.readAsDataURL(file);
                    });
                    e.target.value = "";
                  }} />
                </label>
                <label style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px", background: "#e8f5e9", border: "1px solid #a5d6a7", borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#2e7d32" }}>
                  📸 Chụp ảnh trực tiếp
                  <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = ev => setForm(f => ({ ...f, photos: [...(f.photos||[]), { id: Date.now()+Math.random(), data: ev.target.result, name: "Ảnh chụp "+new Date().toLocaleDateString("vi-VN"), date: new Date().toLocaleDateString("vi-VN"), note: "" }]}));
                    reader.readAsDataURL(file);
                    e.target.value = "";
                  }} />
                </label>
              </div>
              {(form.photos||[]).length === 0 ? (
                <div style={{ padding: 16, textAlign: "center", color: "#aaa", border: "2px dashed #e0e0e0", borderRadius: 8, fontSize: 13 }}>
                  Chưa có ảnh — nhấn nút trên để thêm ảnh xe
                </div>
              ) : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 10 }}>
                  {(form.photos||[]).map((photo, idx) => (
                    <div key={photo.id} style={{ border: "1px solid #e0e0e0", borderRadius: 8, overflow: "hidden", position: "relative" }}>
                      <img src={photo.data} alt={photo.name} style={{ width: "100%", height: 110, objectFit: "cover", display: "block" }} />
                      <div style={{ padding: "5px 7px", background: "#fafafa" }}>
                        <div style={{ fontSize: 10, color: "#aaa", marginBottom: 3 }}>{photo.date}</div>
                        <input value={photo.note||""} onChange={e => { const p=[...(form.photos||[])]; p[idx]={...p[idx],note:e.target.value}; setForm(f=>({...f,photos:p})); }}
                          placeholder="Ghi chú..." style={{ width:"100%", padding:"2px 5px", border:"1px solid #ddd", borderRadius:3, fontSize:11, boxSizing:"border-box" }} />
                      </div>
                      <button onClick={() => setForm(f=>({...f,photos:(f.photos||[]).filter((_,i)=>i!==idx)}))}
                        style={{ position:"absolute", top:3, right:3, background:"rgba(198,40,40,0.85)", border:"none", borderRadius:"50%", width:20, height:20, color:"#fff", cursor:"pointer", fontSize:13, display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
              {(form.photos||[]).length > 0 && <div style={{ fontSize:11, color:"#aaa", marginTop:6 }}>{(form.photos||[]).length} ảnh đã thêm</div>}
            </div>
                        <Btn outline color="#1565c0" onClick={() => printVehicleReceipt(form, data)}>🖨️ In phiếu tiếp nhận</Btn>
            <Btn outline color="#666" onClick={() => setModal(null)}>Huỷ</Btn>
            <Btn onClick={save}>💾 Lưu thông tin xe</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ===================== REPAIR ORDER PAGE =====================
function RepairPage({ data, update, showToast }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_REPAIR_ORDER);
  const [orderParts, setOrderParts] = useState([]);

  const filtered = data.repairOrders.filter(r => {
    const v = data.vehicles.find(v => v.id === r.vehicleId);
    const c = data.customers.find(c => c.id === r.customerId);
    const q = search.toLowerCase();
    const match = (v?.licensePlate || "").toLowerCase().includes(q) || (c?.name || "").toLowerCase().includes(q) || r.id.toLowerCase().includes(q);
    if (statusFilter !== "all" && r.status !== statusFilter) return false;
    return match;
  });

  const openNew = () => {
    setForm({ ...EMPTY_REPAIR_ORDER, id: generateId(), receiveDate: today() });
    setOrderParts([]);
    setModal("form");
  };
  const openEdit = (r) => {
    setForm({ ...r });
    setOrderParts(r.parts || []);
    setModal("form");
  };
  const openView = (r) => { setForm({ ...r }); setOrderParts(r.parts || []); setModal("view"); };

  const calcTotal = (f, pts) => {
    const totalParts = pts.reduce((s, p) => s + (p.qty * p.price), 0);
    const totalAmount = (Number(f.totalLabor) || 0) + totalParts - (Number(f.discount) || 0);
    return { totalParts, totalAmount };
  };

  const addPart = () => setOrderParts([...orderParts, { partId: "", name: "", qty: 1, unit: "", price: 0 }]);
  const removePart = (i) => setOrderParts(orderParts.filter((_, idx) => idx !== i));
  const updatePart = (i, field, val) => {
    const pts = [...orderParts];
    pts[i] = { ...pts[i], [field]: val };
    if (field === "partId") {
      const p = data.parts.find(p => p.id === val);
      if (p) { pts[i].name = p.name; pts[i].unit = p.unit; pts[i].price = p.salePrice; }
    }
    setOrderParts(pts);
  };

  const save = () => {
    if (!form.vehicleId || !form.customerId) return showToast("Chọn xe và khách hàng", "error");
    const { totalParts, totalAmount } = calcTotal(form, orderParts);
    const saved = { ...form, parts: orderParts, totalParts, totalAmount };
    const exists = data.repairOrders.find(r => r.id === form.id);
    const updated = exists ? data.repairOrders.map(r => r.id === form.id ? saved : r) : [...data.repairOrders, saved];
    // If status changed to Hoàn thành, deduct stock
    if (form.status === "Hoàn thành" && orderParts.length > 0) {
      const newParts = data.parts.map(p => {
        const used = orderParts.find(op => op.partId === p.id);
        if (used) return { ...p, stock: Math.max(0, p.stock - Number(used.qty)) };
        return p;
      });
      update("parts", newParts);
      // Log movement
      const movements = [...data.stockMovements, ...orderParts.filter(op => op.partId).map(op => ({
        id: generateId(), date: today(), type: "Xuất", partId: op.partId,
        partName: op.name, qty: op.qty, ref: `LSC-${form.id.slice(-4).toUpperCase()}`, note: "Xuất theo LSC"
      }))];
      update("stockMovements", movements);
    }
    update("repairOrders", updated);
    showToast(exists ? "Đã cập nhật lệnh sửa chữa" : "Đã tạo lệnh sửa chữa");
    setModal(null);
  };

  const { totalParts, totalAmount } = calcTotal(form, orderParts);

  const statusOptions = ["Tiếp nhận", "Đang sửa", "Chờ phụ tùng", "Hoàn thành", "Đã xuất xưởng", "Huỷ"];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center", flexWrap: "wrap" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm biển số, khách hàng..."
              style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 240 }} />
            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} style={{ padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13 }}>
              <option value="all">Tất cả trạng thái</option>
              {statusOptions.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <Btn onClick={openNew}>➕ Tạo lệnh sửa chữa</Btn>
        </div>
      </Card>
      <Card>
        <Table
          headers={["Mã LSC", "Ngày", "Biển số", "Khách hàng", "Triệu chứng", "KTV", "Tổng tiền", "Trạng thái", "Thao tác"]}
          rows={filtered.map(r => {
            const v = data.vehicles.find(v => v.id === r.vehicleId);
            const c = data.customers.find(c => c.id === r.customerId);
            const t = data.technicians.find(t => t.id === r.technicianId);
            return [
              <span style={{ fontWeight: 800, color: "#1a237e" }}>#{r.id.slice(-4).toUpperCase()}</span>,
              formatDate(r.receiveDate),
              <span style={{ fontWeight: 700 }}>{v?.licensePlate || "-"}</span>,
              c?.name || "-",
              r.symptoms.slice(0, 35) + (r.symptoms.length > 35 ? "..." : ""),
              t?.name || "-",
              <span style={{ fontWeight: 700, color: "#2e7d32" }}>{formatCurrency(r.totalAmount)}</span>,

              <div style={{ display: "flex", gap: 4 }}>

const EMPTY_QUOTE = {
  id: null, vehicleId: "", customerId: "", date: today(), status: "Chờ duyệt",
  receiveKm: "", customerRequest: "", notes: "", discount: 0, vatType: "no_vat", items: []
};
const EMPTY_QITEM = { type: "part", partId: "", name: "", qty: 1, unit: "Cái", costPrice: 0, salePrice: 0, hours: 1, laborRate: 150000 };

function QuotesPage({ data, update, showToast }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ ...EMPTY_QUOTE, date: today() });

  // ---------- tính tiền ----------
  const calcItem = (it) => it.type === "labor"
    ? { rev: Number(it.hours) * Number(it.laborRate), cost: 0 }
    : { rev: Number(it.qty) * Number(it.salePrice), cost: Number(it.qty) * Number(it.costPrice) };

  const calcQuote = (q) => {
    const items = q.items || [];
    const totalRev   = items.reduce((s, it) => s + calcItem(it).rev, 0);
    const totalCost  = items.reduce((s, it) => s + calcItem(it).cost, 0);
    const disc       = Number(q.discount) || 0;
    const total      = totalRev - disc;
    const grossProfit = total - totalCost;
    return { totalRev, totalCost, disc, total, grossProfit };
  };

  const { totalRev, totalCost, disc, total, grossProfit } = calcQuote(form);

  // ---------- items ----------
  const addPartItem  = () => setForm(f => ({ ...f, items: [...f.items, { ...EMPTY_QITEM, id: generateId() }] }));
  const addLaborItem = () => setForm(f => ({ ...f, items: [...f.items, { ...EMPTY_QITEM, id: generateId(), type: "labor", name: "Công lao động", unit: "Giờ" }] }));
  const removeItem   = (i) => setForm(f => ({ ...f, items: f.items.filter((_, idx) => idx !== i) }));
  const updateItem   = (i, field, val) => setForm(f => {
    const items = [...f.items];
    items[i] = { ...items[i], [field]: val };
    if (field === "partId" && val) {
      const p = data.parts.find(p => p.id === val);
      if (p) { items[i].name = p.name; items[i].unit = p.unit; items[i].costPrice = p.costPrice; items[i].salePrice = p.salePrice; }
    }
    return { ...f, items };
  });

  // ---------- vehicle auto-fill ----------
  const handleVehicleChange = (vid) => {
    const v = data.vehicles.find(v => v.id === vid);
    setForm(f => ({ ...f, vehicleId: vid, customerId: v?.customerId || f.customerId, receiveKm: v?.currentKm || "" }));
  };

  // ---------- save / delete ----------
  const save = () => {
    if (!form.vehicleId || !form.customerId) return showToast("Chọn xe và khách hàng", "error");
    const id = form.id || generateId();
    const calc = calcQuote(form);
    const saved = { ...form, id, ...calc };
    const exists = (data.quotes || []).find(q => q.id === form.id);
    const updated = exists
      ? (data.quotes || []).map(q => q.id === form.id ? saved : q)
      : [...(data.quotes || []), saved];
    update("quotes", updated);
    showToast("Đã lưu báo giá");
    setModal(false);
  };
  const del = (id) => {
    if (!window.confirm("Xóa báo giá này?")) return;
    update("quotes", (data.quotes || []).filter(q => q.id !== id));
    showToast("Đã xóa");
  };
  const openNew  = () => { setForm({ ...EMPTY_QUOTE, date: today() }); setModal(true); };
  const openEdit = (q) => { setForm({ ...q }); setModal(true); };

  const approvedQuotes = (data.quotes || []).filter(q => q.status === "Đã duyệt");
  const totalApproved  = approvedQuotes.reduce((s, q) => s + (Number(q.total) || 0), 0);
  const totalProfit    = approvedQuotes.reduce((s, q) => s + (Number(q.grossProfit) || 0), 0);
  const selVehicle     = data.vehicles.find(v => v.id === form.vehicleId);
  const selCustomer    = data.customers.find(c => c.id === form.customerId);

  const inpStyle = (extra = {}) => ({ padding: "6px 8px", border: "1px solid #ddd", borderRadius: 5, fontSize: 13, width: "100%", ...extra });
  const numInp   = (val, onChange, w = "100%", border = "#ddd", bg = "#fff") => (
    <input type="number" value={val} onChange={e => onChange(e.target.value)}
      style={{ padding: "5px 6px", border: "1px solid " + border, borderRadius: 4, fontSize: 12, width: w, background: bg, textAlign: "right" }} />
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        <StatCard label="Tổng báo giá" value={(data.quotes||[]).length} icon="🧾" color="#1a237e" />
        <StatCard label="Đã duyệt" value={approvedQuotes.length} icon="✅" color="#2e7d32" />
        <StatCard label="Doanh thu dự kiến" value={formatCurrency(totalApproved)} icon="💰" color="#1565c0" sub="Từ báo giá đã duyệt" />
        <StatCard label="Lãi ước tính" value={formatCurrency(totalProfit)} icon="📈" color={totalProfit >= 0 ? "#1565c0" : "#c62828"} sub="DT – Giá vốn VT" />
      </div>

      {/* Toolbar */}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontWeight: 700, color: "#1a237e" }}>Danh sách báo giá ({(data.quotes||[]).length})</div>
          <Btn onClick={openNew}>➕ Tạo báo giá</Btn>
        </div>
      </Card>

      {/* List */}
      <Card>
        <Table
          headers={["Mã BG", "Ngày", "Khách hàng", "Xe / Biển số", "Nội dung", "Tổng BG", "Giá vốn VT", "Lãi ước tính", "Trạng thái", "Thao tác"]}
          rows={(data.quotes || []).slice().reverse().map(q => {
            const c = data.customers.find(c => c.id === q.customerId);
            const v = data.vehicles.find(v => v.id === q.vehicleId);
            const profit = Number(q.grossProfit) || (Number(q.total) - Number(q.totalCost));
            return [
              <span style={{ fontWeight: 800, color: "#1a237e" }}>#{(q.id||"").slice(-4).toUpperCase()}</span>,
              formatDate(q.date),
              <div><div style={{ fontWeight: 700 }}>{c?.name||"-"}</div><div style={{ fontSize: 11, color: "#888" }}>{c?.phone||""}</div></div>,
              <div><div style={{ fontWeight: 700, color: "#1a237e" }}>{v?.licensePlate||"-"}</div><div style={{ fontSize: 11, color: "#888" }}>{v?.vehicleName||""}</div></div>,
              <span style={{ fontSize: 11, color: "#666" }}>{(q.customerRequest||"—").slice(0, 30)}</span>,
              <span style={{ fontWeight: 700, color: "#2e7d32" }}>{formatCurrency(q.total)}</span>,
              <span style={{ color: "#e65100" }}>{formatCurrency(q.totalCost)}</span>,
              <span style={{ fontWeight: 700, color: profit >= 0 ? "#1565c0" : "#c62828" }}>{formatCurrency(profit)}</span>,
              <Badge label={q.status} color={q.status==="Đã duyệt"?"#2e7d32":q.status==="Huỷ"?"#c62828":"#f57c00"} />,
              <div style={{ display: "flex", gap: 4 }}>
                <Btn size="sm" onClick={() => openEdit(q)} outline>✏️ Mở</Btn>

              </div>
            ];
          })}
          emptyMsg="Chưa có báo giá nào"
        />
      </Card>

      {/* ===== MODAL ===== */}
      {modal && (

                  ["Nhãn hiệu", selVehicle.brand],
                  ["Loại xe", selVehicle.type],

                    const lineProfit = rev - cost;
                    const isPart = it.type !== "labor";
                    return (
                      <tr key={i} style={{ borderBottom: "1px solid #f0f0f0", background: isPart ? "#fff" : "#fdf3f6" }}>

                        <td style={{ padding: "4px 5px" }}>

                            <select value={it.partId || ""} onChange={e => updateItem(i, "partId", e.target.value)}

                              <option value="">— Chọn từ kho (tuỳ chọn) —</option>
                              {data.parts.map(p => <option key={p.id} value={p.id}>{p.name} (tồn: {p.stock})</option>)}
                            </select>
                          )}
                          <input value={it.name} onChange={e => updateItem(i, "name", e.target.value)}
                            style={{ width: "100%", padding: "5px 7px", border: "1px solid #ddd", borderRadius: 4, fontSize: 12 }}
                            placeholder={isPart ? "Tên vật tư / dịch vụ" : "Tên công việc"} />
                        </td>

                        {/* Loại */}
                        <td style={{ padding: "4px 5px", textAlign: "center" }}>
                          <select value={it.type} onChange={e => updateItem(i, "type", e.target.value)}
                            style={{ fontSize: 10, padding: "3px 2px", border: "1px solid #ddd", borderRadius: 4, background: isPart ? "#e3f2fd" : "#e8f5e9", color: isPart ? "#1565c0" : "#2e7d32", fontWeight: 700 }}>
                            <option value="part">📦 VT</option>
                            <option value="labor">⏱️ GC</option>
                          </select>
                        </td>

                        {/* Giá nhập */}
                        <td style={{ padding: "4px 5px", background: "#fffde7" }}>
                          {isPart
                            ? numInp(it.costPrice, v => updateItem(i, "costPrice", v), "100%", "#ffc107", "#fffde7")
                            : <div style={{ textAlign: "center", color: "#ccc", fontSize: 11 }}>—</div>}
                        </td>

                        {/* Giá bán / đơn giá */}
                        <td style={{ padding: "4px 5px", background: "#f1f8e9" }}>
                          {isPart
                            ? numInp(it.salePrice, v => updateItem(i, "salePrice", v), "100%", "#a5d6a7", "#f1f8e9")
                            : numInp(it.laborRate, v => updateItem(i, "laborRate", v), "100%", "#90caf9", "#e3f2fd")}
                        </td>

                        {/* SL / Giờ */}
                        <td style={{ padding: "4px 5px" }}>
                          {numInp(isPart ? it.qty : it.hours, v => updateItem(i, isPart ? "qty" : "hours", v), "100%")}
                        </td>

                        {/* ĐV */}
                        <td style={{ padding: "4px 5px" }}>
                          <input value={it.unit} onChange={e => updateItem(i, "unit", e.target.value)}
                            style={{ width: "100%", padding: "5px 3px", border: "1px solid #ddd", borderRadius: 4, fontSize: 11, textAlign: "center" }} />
                        </td>

                        {/* Thành tiền - tự động */}
                        <td style={{ padding: "4px 8px", textAlign: "right", fontWeight: 700, color: "#2e7d32", fontSize: 13 }}>
                          {formatCurrency(rev)}
                        </td>

                        {/* Lãi dòng - tự động */}
                        <td style={{ padding: "4px 8px", textAlign: "right", fontWeight: 700, color: lineProfit >= 0 ? "#1565c0" : "#c62828" }}>
                          {formatCurrency(lineProfit)}
                        </td>

                        {/* Xóa */}
                        <td style={{ padding: "4px 5px", textAlign: "center" }}>
                          <button onClick={() => removeItem(i)} style={{ background: "none", border: "none", cursor: "pointer", color: "#c62828", fontSize: 16, lineHeight: 1 }}>✕</button>
                        </td>
                      </tr>
                    );
                  })}
              </tbody>
              <tfoot>
                <tr style={{ background: "#f5f5f5" }}>
                  <td colSpan={6} style={{ padding: "6px 8px", fontWeight: 700, color: "#333" }}>Tổng trước chiết khấu</td>
                  <td style={{ padding: "6px 8px", textAlign: "right", fontWeight: 800, color: "#2e7d32" }}>{formatCurrency(totalRev)}</td>
                  <td style={{ padding: "6px 8px", textAlign: "right", fontWeight: 800, color: "#1565c0" }}>{formatCurrency(totalRev - totalCost)}</td>
                  <td></td>
                </tr>
                <tr style={{ background: "#fff8e1" }}>
                  <td colSpan={7} style={{ padding: "6px 8px", color: "#e65100" }}>Tổng giá vốn vật tư</td>
                  <td style={{ padding: "6px 8px", textAlign: "right", color: "#e65100", fontWeight: 700 }}>{formatCurrency(totalCost)}</td>
                  <td></td>
                </tr>
                <tr style={{ background: "#fff8e1" }}>
                  <td colSpan={5} style={{ padding: "6px 8px", color: "#e65100", fontWeight: 600 }}>Chiết khấu</td>
                  <td colSpan={2} style={{ padding: "6px 8px" }}>
                    <input type="number" value={form.discount} onChange={e => setForm({ ...form, discount: e.target.value })}
                      style={{ width: 130, padding: "5px 8px", border: "1px solid #ffc107", borderRadius: 4, fontSize: 13, textAlign: "right", background: "#fffde7" }} />
                  </td>
                  <td style={{ padding: "6px 8px", textAlign: "right", color: "#e65100", fontWeight: 700 }}>- {formatCurrency(disc)}</td>
                  <td></td>
                </tr>
                {(() => {
                  const vatRate = form.vatType === "vat8" ? 0.08 : form.vatType === "vat10" ? 0.10 : 0;
                  const vatAmt  = Math.round(total * vatRate);
                  const totalWithVat = total + vatAmt;
                  return (<>
                    {form.vatType !== "no_vat" && form.vatType !== "included" && vatRate > 0 && (
                      <tr style={{ background: "#fff8e1" }}>
                        <td colSpan={7} style={{ padding: "6px 8px", color: "#e65100" }}>VAT {form.vatType === "vat8" ? "8%" : "10%"}</td>
                        <td style={{ padding: "6px 8px", textAlign: "right", color: "#e65100", fontWeight: 700 }}>{formatCurrency(vatAmt)}</td>
                        <td></td>
                      </tr>
                    )}
                    <tr style={{ background: "#e8f5e9" }}>
                      <td colSpan={7} style={{ padding: "8px 10px", fontWeight: 800, fontSize: 14, color: "#2e7d32" }}>
                        TỔNG BÁO GIÁ KHÁCH TRẢ
                        {form.vatType === "included" && <span style={{ fontSize: 11, fontWeight: 400, marginLeft: 8 }}>(Đã bao gồm VAT)</span>}
                        {form.vatType !== "no_vat" && form.vatType !== "included" && vatRate > 0 && <span style={{ fontSize: 11, fontWeight: 400, marginLeft: 8 }}>(Đã bao gồm VAT {form.vatType === "vat8" ? "8%" : "10%"})</span>}
                      </td>
                      <td style={{ padding: "8px 10px", textAlign: "right", fontWeight: 900, fontSize: 17, color: "#2e7d32" }}>{formatCurrency(totalWithVat)}</td>
                      <td></td>
                    </tr>
                    <tr style={{ background: "#e3f2fd" }}>
                      <td colSpan={7} style={{ padding: "6px 8px", fontWeight: 700, color: "#1565c0" }}>💰 Lãi ước tính (Doanh thu – Giá vốn VT)</td>
                      <td style={{ padding: "6px 8px", textAlign: "right", fontWeight: 800, fontSize: 14, color: grossProfit >= 0 ? "#1565c0" : "#c62828" }}>{formatCurrency(grossProfit)}</td>
                      <td></td>
                    </tr>
                  </>);
                })()}
              </tfoot>
            </table>
          </div>

          {/* Ghi chú */}
          <div style={{ marginTop: 10 }}>
            <label style={{ fontSize: 11, fontWeight: 600, color: "#555", display: "block", marginBottom: 3 }}>Ghi chú</label>
            <textarea value={form.notes||""} onChange={e => setForm({ ...form, notes: e.target.value })} rows={2}
              style={{ width: "100%", padding: "7px 10px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, resize: "vertical", boxSizing: "border-box" }} />
          </div>

          {/* Actions */}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 16 }}>
            <Btn outline color="#1565c0" onClick={() => {
              const t = (form.items||[]).reduce((s,it) => s + (it.type==="labor" ? Number(it.hours)*Number(it.laborRate) : Number(it.qty)*Number(it.salePrice)), 0) - (Number(form.discount)||0);
              printQuote({...form, total: t}, data);
            }}>🖨️ In báo giá</Btn>
            <Btn outline color="#666" onClick={() => setModal(false)}>Huỷ</Btn>
            <Btn onClick={save}>💾 Lưu báo giá</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ===================== PARTS PAGE =====================
function PartsPage({ data, update, showToast }) {
  const [tab, setTab] = useState("inventory");
  const [search, setSearch] = useState("");
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState(EMPTY_PART);
  const [moveForm, setMoveForm] = useState({ partId: "", type: "Nhập", qty: 1, note: "", date: today() });

  const filtered = data.parts.filter(p =>
    p.name.toLowerCase().includes(search.toLowerCase()) ||
    p.code.toLowerCase().includes(search.toLowerCase())
  );

  const openNew = () => { setForm({ ...EMPTY_PART, id: generateId() }); setModal("part"); };
  const openEdit = (p) => { setForm({ ...p }); setModal("part"); };
  const savePart = () => {
    if (!form.name || !form.code) return showToast("Nhập mã và tên vật tư", "error");
    const exists = data.parts.find(p => p.id === form.id);
    const updated = exists ? data.parts.map(p => p.id === form.id ? form : p) : [...data.parts, form];
    update("parts", updated);
    showToast(exists ? "Đã cập nhật" : "Đã thêm vật tư");
    setModal(null);
  };
  const del = (id) => {
    if (!adminConfirm("xóa")) return;
    if (!window.confirm("Xóa vật tư?")) return;
    update("parts", data.parts.filter(p => p.id !== id));
    showToast("Đã xóa");
  };
  const saveMove = () => {
    if (!moveForm.partId || !moveForm.qty) return showToast("Chọn vật tư và số lượng", "error");
    const part = data.parts.find(p => p.id === moveForm.partId);
    if (!part) return;
    const newQty = moveForm.type === "Nhập" ? part.stock + Number(moveForm.qty) : Math.max(0, part.stock - Number(moveForm.qty));
    const newParts = data.parts.map(p => p.id === moveForm.partId ? { ...p, stock: newQty } : p);
    const movement = { id: generateId(), date: moveForm.date, type: moveForm.type, partId: moveForm.partId, partName: part.name, qty: Number(moveForm.qty), note: moveForm.note, ref: moveForm.type + "-" + today() };
    update("parts", newParts);
    update("stockMovements", [...data.stockMovements, movement]);
    showToast(`Đã ${moveForm.type} kho thành công`);
    setMoveForm({ partId: "", type: "Nhập", qty: 1, note: "", date: today() });
    setModal(null);
  };

  const tabs = [
    { id: "inventory", label: "📦 Tồn kho" },
    { id: "movements", label: "📋 Xuất nhập kho" },
    { id: "lowstock", label: `⚠️ Sắp hết (${data.parts.filter(p => p.stock <= p.minStock).length})` }
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 0, background: "#fff", borderRadius: 10, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,0.08)" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            style={{ flex: 1, padding: "12px", border: "none", background: tab === t.id ? "#1a237e" : "transparent", color: tab === t.id ? "#fff" : "#666", fontWeight: tab === t.id ? 700 : 400, cursor: "pointer", fontSize: 13, transition: "all .15s" }}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "inventory" && (
        <>
          <Card>
            <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center" }}>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Tìm mã, tên vật tư..."
                style={{ padding: "7px 12px", border: "1px solid #ddd", borderRadius: 6, fontSize: 13, width: 260 }} />
              <div style={{ display: "flex", gap: 8 }}>
                <Btn outline onClick={() => setModal("move")}>📤 Xuất / Nhập kho</Btn>
                <Btn onClick={openNew}>➕ Thêm vật tư</Btn>
              </div>
            </div>
          </Card>
          <Card>
            <Table
              headers={["Mã", "Tên vật tư", "Nhóm", "ĐV", "Giá vốn", "Giá bán", "Tồn kho", "Vị trí", "Thao tác"]}
              rows={filtered.map(p => [
                <span style={{ fontFamily: "monospace", fontWeight: 700, color: "#1a237e" }}>{p.code}</span>,
                p.name, p.category, p.unit,
                formatCurrency(p.costPrice), formatCurrency(p.salePrice),
                <span style={{ fontWeight: 700, color: p.stock <= p.minStock ? "#c62828" : "#2e7d32" }}>{p.stock} {p.unit} {p.stock <= p.minStock ? "⚠️" : ""}</span>,
                p.location || "-",
                <div style={{ display: "flex", gap: 4 }}>
                  <Btn size="sm" onClick={() => openEdit(p)} outline>✏️</Btn>
                  <Btn size="sm" onClick={() => del(p.id)} color="#c62828" outline>🗑️</Btn>
                </div>
              ])}
            />
          </Card>
        </>
      )}

      {tab === "movements" && (
        <Card>
          <Table
            headers={["Ngày", "Loại", "Vật tư", "Số lượng", "Chứng từ", "Ghi chú"]}
            rows={(data.stockMovements || []).slice().reverse().map(m => [
              formatDate(m.date),
              <Badge label={m.type} color={m.type === "Nhập" ? "#2e7d32" : "#f57c00"} />,
              m.partName, m.qty, m.ref || "-", m.note || "-"
            ])}
            emptyMsg="Chưa có giao dịch kho"
          />
        </Card>
      )}

      {tab === "lowstock" && (
        <Card>
          <div style={{ marginBottom: 12, color: "#c62828", fontWeight: 700 }}>⚠️ Các vật tư có tồn kho dưới mức tối thiểu</div>
          <Table
            headers={["Mã", "Tên vật tư", "Tồn hiện tại", "Tồn tối thiểu", "Cần nhập thêm"]}
            rows={data.parts.filter(p => p.stock <= p.minStock).map(p => [
              p.code, p.name,
              <span style={{ color: "#c62828", fontWeight: 700 }}>{p.stock} {p.unit}</span>,
              `${p.minStock} ${p.unit}`,
              <span style={{ color: "#f57c00", fontWeight: 700 }}>{Math.max(0, p.minStock * 2 - p.stock)} {p.unit}</span>
            ])}
            emptyMsg="Kho đủ hàng ✅"
          />
        </Card>
      )}

      {modal === "part" && (
        <Modal title={data.parts.find(p => p.id === form.id) ? "Cập nhật vật tư" : "Thêm vật tư"} onClose={() => setModal(null)}>
          <Grid cols={2} gap={12}>
            <Input label="Mã vật tư" value={form.code} onChange={v => setForm({ ...form, code: v })} required />

function AccountingPage({ data }) {
  const [period, setPeriod] = useState("month");
  const now = new Date();
  const filterByPeriod = (r) => {
    const d = new Date(r.receiveDate || r.date);
    if (period === "today") return (r.receiveDate || r.date) === today();
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  };

  const orders = data.repairOrders.filter(filterByPeriod);
  const completed = orders.filter(r => r.status === "Hoàn thành" || r.status === "Đã xuất xưởng");
  const revenue = completed.reduce((s, r) => s + (Number(r.totalAmount) || 0), 0);
  const labor = completed.reduce((s, r) => s + (Number(r.totalLabor) || 0), 0);
  const partsRev = completed.reduce((s, r) => s + (Number(r.totalParts) || 0), 0);
  const partsCost = completed.reduce((s, r) => {
    const pts = r.parts || [];
    return s + pts.reduce((ps, pt) => {
      const p = data.parts.find(p => p.id === pt.partId);
      return ps + (p ? p.costPrice * pt.qty : 0);
    }, 0);
  }, 0);
  const discount = completed.reduce((s, r) => s + (Number(r.discount) || 0), 0);
  const paid = completed.reduce((s, r) => s + (Number(r.paid) || 0), 0);
  const debt = completed.reduce((s, r) => s + (Number(r.totalAmount) - Number(r.paid)), 0);
  const stockValue = data.parts.reduce((s, p) => s + p.costPrice * p.stock, 0);

  // Operating costs from salary records + operating expenses
  const salaryRecordsInPeriod = (data.salaryRecords || []).filter(sr => {
    if (period === "all") return true;
    const d = new Date(sr.month + "-01");
    if (period === "today") return false;
    if (period === "month") return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    if (period === "year") return d.getFullYear() === now.getFullYear();
    return true;
  });
  const totalSalaryPaid = salaryRecordsInPeriod.reduce((s, sr) => s + (Number(sr.netSalary) || 0), 0);
  const totalBHXHCompany = salaryRecordsInPeriod.reduce((s, sr) => s + (Number(sr.bhxhCompany) || 0) + (Number(sr.bhytCompany) || 0) + (Number(sr.bhtnCompany) || 0), 0);
  const opExpenses = (data.operatingExpenses || []).filter(filterByPeriod);
  const totalOpExp = opExpenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const totalCosts = partsCost + totalSalaryPaid + totalBHXHCompany + totalOpExp;
  const netProfit = revenue - totalCosts;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <Card>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <div style={{ fontWeight: 700, color: "#1a237e" }}>Kỳ báo cáo:</div>
          {[["today", "Hôm nay"], ["month", "Tháng này"], ["year", "Năm nay"], ["all", "Tất cả"]].map(([v, l]) => (
            <button key={v} onClick={() => setPeriod(v)}
              style={{ padding: "6px 16px", border: `2px solid ${period === v ? "#1a237e" : "#ddd"}`, borderRadius: 20, background: period === v ? "#1a237e" : "#fff", color: period === v ? "#fff" : "#666", fontWeight: 600, cursor: "pointer", fontSize: 13 }}>
              {l}
            </button>
          ))}
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 14 }}>
        <StatCard label="Tổng doanh thu" value={formatCurrency(revenue)} icon="💰" color="#2e7d32" sub={`${completed.length} lệnh hoàn thành`} />
        <StatCard label="Lợi nhuận ròng" value={formatCurrency(netProfit)} icon="📈" color={netProfit >= 0 ? "#1a237e" : "#c62828"} sub="Sau tất cả chi phí" />
        <StatCard label="Đã thu" value={formatCurrency(paid)} icon="✅" color="#1565c0" />
        <StatCard label="Công nợ còn lại" value={formatCurrency(Math.max(0, debt))} icon="⚠️" color={debt > 0 ? "#c62828" : "#2e7d32"} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <Card>
          <div style={{ fontWeight: 700, color: "#1a237e", marginBottom: 12, fontSize: 15 }}>📊 Báo cáo lãi lỗ (P&L)</div>
          {[
            { label: "Doanh thu sửa chữa", val: revenue, color: "#2e7d32", indent: 0 },
            { label: "  — Tiền công lao động", val: labor, color: "#1565c0", indent: 1 },
            { label: "  — Doanh thu vật tư", val: partsRev, color: "#1565c0", indent: 1 },
            { label: "  — Chiết khấu", val: -discount, color: "#f57c00", indent: 1 },
            { label: "Giá vốn vật tư", val: -partsCost, color: "#c62828", indent: 0 },
            { label: "Chi phí lương nhân viên", val: -totalSalaryPaid, color: "#c62828", indent: 0 },
            { label: "BHXH công ty đóng", val: -totalBHXHCompany, color: "#c62828", indent: 0 },
            { label: "Chi phí vận hành khác", val: -totalOpExp, color: "#c62828", indent: 0 },
            { label: "LỢI NHUẬN RÒNG", val: netProfit, color: netProfit >= 0 ? "#1a237e" : "#c62828", indent: 0, bold: true },
          ].map((item, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: i < 8 ? "1px solid #f5f5f5" : "2px solid #1a237e", paddingLeft: item.indent ? 16 : 0 }}>

          <Card>

                { label: "Tổng chi nhân sự", val: totalSalaryPaid + totalBHXHCompany, color: "#7b1fa2", bg: "#f3e5f5", bold: true },

          </Card>
          <Card>

// BHXH rates Vietnam 2026: Employee: BHXH 8%, BHYT 1.5%, BHTN 1% = 10.5%
//                          Company:  BHXH 17.5%, BHYT 3%, BHTN 1% = 21.5%
const BHXH_EMP = { bhxh: 8, bhyt: 1.5, bhtn: 1 };
const BHXH_CO  = { bhxh: 17.5, bhyt: 3, bhtn: 1 };
const calcSalary = (staff, bonus = 0, deduct = 0, workDays = 26) => {
  const base = Number(staff.basicSalary) || 0;
  const allowance = Number(staff.allowance) || 0;
  const grossBase = base * (workDays / 26); // pro-rate by days
  const bhxhEmp = grossBase * (BHXH_EMP.bhxh + BHXH_EMP.bhyt + BHXH_EMP.bhtn) / 100;
  const bhxhCo  = grossBase * (BHXH_CO.bhxh + BHXH_CO.bhyt + BHXH_CO.bhtn) / 100;
  const bhytCo  = 0; // already in bhxhCo combined
  const bhtnCo  = 0;
  const gross = grossBase + allowance + Number(bonus);
  const net = gross - bhxhEmp - Number(deduct);
  const bhxhCoAmt = grossBase * BHXH_CO.bhxh / 100;
  const bhytCoAmt = grossBase * BHXH_CO.bhyt / 100;
  const bhtnCoAmt = grossBase * BHXH_CO.bhtn / 100;
  const bhxhEmpAmt = grossBase * BHXH_EMP.bhxh / 100;
  const bhytEmpAmt = grossBase * BHXH_EMP.bhyt / 100;
  const bhtnEmpAmt = grossBase * BHXH_EMP.bhtn / 100;
  return { grossBase, allowance, bonus: Number(bonus), deduct: Number(deduct), gross, bhxhEmpAmt, bhytEmpAmt, bhtnEmpAmt, bhxhEmp, net, bhxhCoAmt, bhytCoAmt, bhtnCoAmt, bhxhCo: bhxhCoAmt + bhytCoAmt + bhtnCoAmt };
};

function ExpensesPage({ data, update, showToast }) {

  const [staffForm, setStaffForm] = useState(EMPTY_STAFF);
  const [salaryMonth, setSalaryMonth] = useState(() => {
    const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  });
  const [salaryData, setSalaryData] = useState({});
  const [expForm, setExpForm] = useState({ id: null, date: today(), category: "", description: "", amount: 0, paymentMethod: "Tiền mặt", notes: "" });
  const [expSearch, setExpSearch] = useState("");

  // Init salary overrides for current month
  const initSalaryOverrides = (month) => {
    const existing = {};
    (data.salaryRecords || []).filter(s => s.month === month).forEach(s => { existing[s.staffId] = s; });
    return existing;
  };

  const handleOpenSalary = () => {
    setSalaryData(initSalaryOverrides(salaryMonth));
    setModal("salary");
  };

  const getSalaryRow = (staff) => {
    const override = salaryData[staff.id] || {};
    const bonus = override.bonus || 0;
    const deduct = override.deduct || 0;
    const workDays = override.workDays || 26;
    return { ...calcSalary(staff, bonus, deduct, workDays), bonus, deduct, workDays };
  };

  const saveSalaryRecords = () => {
    const records = (data.staffs || []).map(staff => {
      const override = salaryData[staff.id] || {};
      const bonus = Number(override.bonus || 0);
      const deduct = Number(override.deduct || 0);
      const workDays = Number(override.workDays || 26);
      const calc = calcSalary(staff, bonus, deduct, workDays);
      return {
        id: `sr-${salaryMonth}-${staff.id}`,
        month: salaryMonth, staffId: staff.id, staffName: staff.name,
        position: staff.position, basicSalary: staff.basicSalary,
        allowance: staff.allowance, bonus, deduct, workDays,
        grossBase: calc.grossBase, gross: calc.gross,
